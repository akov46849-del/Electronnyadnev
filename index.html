<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Класс Жур — электронный журнал</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='28' fill='%230EA5E9'/><path d='M25 40 Q60 30 60 40 Q60 30 95 40 L95 82 Q60 72 60 82 Q60 72 25 82 Z' fill='%23FFFFFF'/><line x1='60' y1='40' x2='60' y2='82' stroke='%230EA5E9' stroke-width='2'/><path d='M42 60 L56 74 L84 46' stroke='%23FACC15' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
<style>
:root{
  --bg:#F8FAFC;--bg-elev:#FFFFFF;--text:#0F172A;--text-muted:#64748B;--border:#E2E8F0;
  --primary:#0EA5E9;--primary-hover:#0284C7;--accent:#A855F7;--brand-yellow:#FACC15;
  --danger:#EF4444;--success:#10B981;--warning:#F59E0B;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 10px 25px rgba(14,165,233,.18);
  --radius:12px;--radius-lg:18px;--transition:.2s ease;
}
[data-theme="dark"]{
  --bg:#0F172A;--bg-elev:#1E293B;--text:#E2E8F0;--text-muted:#94A3B8;--border:#334155;
  --primary:#38BDF8;--primary-hover:#7DD3FC;--accent:#C084FC;--brand-yellow:#FDE047;
  --shadow:0 1px 3px rgba(0,0,0,.4);--shadow-lg:0 10px 25px rgba(56,189,248,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;
  transition:background var(--transition),color var(--transition);
}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit}

.brand{display:flex;align-items:center;gap:12px}
.brand-logo{flex-shrink:0;filter:drop-shadow(0 4px 10px rgba(14,165,233,.25))}
.brand-text{line-height:1.1}
.brand-name{
  font-size:16px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
}
.brand-tag{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:2px}
.btn svg{flex-shrink:0}
.nav-item svg{flex-shrink:0}
.nav-item span{flex:1}

#auth-screen{
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
  background:linear-gradient(135deg,#0EA5E9 0%,#38BDF8 40%,#A855F7 100%);
  position:relative;overflow:hidden;
}
#auth-screen::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 15% 20%,rgba(250,204,21,.15),transparent 45%),
             radial-gradient(circle at 85% 80%,rgba(168,85,247,.25),transparent 50%);
  pointer-events:none;
}
.auth-card{
  background:var(--bg-elev);border-radius:var(--radius-lg);padding:36px;max-width:430px;width:100%;
  box-shadow:var(--shadow-lg);animation:slideUp .4s ease;position:relative;z-index:1;
}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .brand-logo{margin:0 auto 14px;display:block}
.auth-logo h1{
  font-size:26px;margin-bottom:6px;letter-spacing:-.03em;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
}
.auth-subtitle{color:var(--text-muted);font-size:13px;font-weight:500}
.auth-slogan{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:5px 14px;
  background:linear-gradient(135deg,rgba(14,165,233,.12),rgba(168,85,247,.12));
  color:var(--primary);font-size:11px;font-weight:700;border-radius:20px;
}
.auth-slogan svg{color:var(--brand-yellow)}
.auth-tabs{display:flex;background:var(--bg);border-radius:var(--radius);padding:4px;margin-bottom:20px}
.auth-tab{
  flex:1;padding:9px;border:none;background:transparent;color:var(--text-muted);
  font-weight:600;border-radius:9px;cursor:pointer;transition:var(--transition);font-size:13px;
}
.auth-tab.active{background:var(--bg-elev);color:var(--text);box-shadow:var(--shadow)}
.auth-form{display:none}
.auth-form.active{display:block;animation:fadeIn .3s ease}
.form-group{margin-bottom:14px}
.form-group label{
  display:block;font-size:11px;font-weight:700;color:var(--text-muted);
  margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;
}
input,select,textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--border);background:var(--bg);
  color:var(--text);border-radius:10px;font-size:14px;font-family:inherit;transition:var(--transition);
}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--primary);background:var(--bg-elev);
  box-shadow:0 0 0 4px rgba(14,165,233,.15);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;
  border:1px solid transparent;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
  transition:var(--transition);white-space:nowrap;
}
.btn-primary{background:linear-gradient(135deg,var(--primary),#38BDF8);color:#fff;box-shadow:0 4px 12px rgba(14,165,233,.28)}
.btn-primary:hover{background:linear-gradient(135deg,var(--primary-hover),var(--primary));transform:translateY(-1px);box-shadow:0 6px 18px rgba(14,165,233,.4)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--border)}
.btn-ghost:hover{background:var(--bg);border-color:var(--primary);color:var(--primary)}
.btn-block{width:100%}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;gap:5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.auth-link{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted);font-weight:500}
.auth-link:hover{color:var(--primary)}
.auth-message{margin-top:16px;padding:11px 14px;border-radius:10px;font-size:13px;display:none}
.auth-message.error{display:block;background:rgba(239,68,68,.1);color:var(--danger)}
.auth-message.success{display:block;background:rgba(16,185,129,.1);color:var(--success)}

#app-screen{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--bg-elev);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform var(--transition)}
.sidebar-header{padding:20px 18px;border-bottom:1px solid var(--border)}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;
  color:var(--text-muted);cursor:pointer;font-size:14px;font-weight:500;margin-bottom:2px;
  transition:var(--transition);position:relative;
}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,rgba(14,165,233,.12),rgba(168,85,247,.08));color:var(--primary);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--primary);border-radius:0 3px 3px 0}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
.sidebar-footer .btn{flex:1}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  display:flex;align-items:center;gap:16px;padding:14px 22px;background:var(--bg-elev);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;
  backdrop-filter:saturate(180%) blur(10px);
}
.topbar h1{font-size:18px;flex:1;font-weight:700;letter-spacing:-.01em}
.user-info{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500}
.badge{padding:4px 10px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.content{padding:18px;flex:1}
.only-mobile{display:none}
@media (max-width:768px){
  .only-mobile{display:inline-flex}
  .sidebar{position:fixed;z-index:100;height:100%;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  .content{padding:12px}
}
.card{background:var(--bg-elev);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--border)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:700;letter-spacing:-.01em}
.grid{display:grid;gap:14px}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat-card{background:var(--bg-elev);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:var(--transition);border:1px solid var(--border);position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--accent));opacity:0;transition:var(--transition)}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:transparent}
.stat-card:hover::after{opacity:1}
.stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-weight:700}
.stat-value{font-size:26px;font-weight:800;letter-spacing:-.02em}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--bg-elev);border-radius:var(--radius);overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--bg);font-weight:700;font-size:11px;text-transform:uppercase;color:var(--text-muted);letter-spacing:.05em}
tbody tr:hover{background:rgba(14,165,233,.04)}
tbody tr:last-child td{border-bottom:none}
.empty{padding:38px;text-align:center;color:var(--text-muted)}
.grade{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 8px;border-radius:8px;font-weight:800;color:#fff;cursor:pointer;transition:var(--transition)}
.g-5{background:#10B981}.g-4{background:#84CC16}.g-3{background:#F59E0B}.g-2{background:#EF4444}.g-1{background:#991B1B}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fadeIn .2s ease}
.modal{background:var(--bg-elev);border-radius:var(--radius-lg);padding:22px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .25s ease}
.modal-wide{max-width:680px}
.modal-title{font-size:17px;margin-bottom:16px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.modal-title svg{color:var(--primary);flex-shrink:0}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.toast-root{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:var(--bg-elev);color:var(--text);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:13px;animation:slideIn .3s ease;pointer-events:auto;max-width:340px;border-left:4px solid var(--primary);font-weight:500;display:flex;align-items:flex-start;gap:10px}
.toast svg{flex-shrink:0;margin-top:1px}
.toast.success{border-left-color:var(--success)}.toast.success svg{color:var(--success)}
.toast.error{border-left-color:var(--danger)}.toast.error svg{color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}.toast.warning svg{color:var(--warning)}
.toast.info svg{color:var(--primary)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.invite-code{display:inline-flex;align-items:center;gap:8px;font-family:"Courier New",monospace;background:var(--bg);padding:7px 12px;border-radius:8px;font-weight:800;font-size:15px;letter-spacing:.12em;color:var(--primary);border:1.5px dashed rgba(14,165,233,.3)}
.invite-code.used{opacity:.45;text-decoration:line-through;color:var(--text-muted)}
.loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:999}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:12px;color:var(--text-muted);margin-top:6px;line-height:1.5;display:flex;align-items:center;gap:6px}
.hint svg{flex-shrink:0}
.brand-logo{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* Чекбоксы предметов */
.subjects-toolbar{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.subjects-toolbar input{flex:1;min-width:140px}
.subjects-box{max-height:300px;overflow-y:auto;border:1.5px solid var(--border);border-radius:10px;padding:10px;background:var(--bg)}
.subject-group{margin-bottom:12px}
.subject-group:last-child{margin-bottom:0}
.subject-group-title{font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:700;letter-spacing:.05em;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.subject-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;transition:var(--transition);font-size:13px;user-select:none}
.subject-item:hover{background:var(--bg-elev)}
.subject-item.checked{background:linear-gradient(135deg,rgba(14,165,233,.12),rgba(168,85,247,.08));color:var(--primary);font-weight:600}
.subject-item input[type="checkbox"]{width:16px;height:16px;margin:0;flex-shrink:0;accent-color:var(--primary);cursor:pointer}
.subject-counter{margin-top:8px;font-size:12px;color:var(--text-muted)}
.subject-counter b{color:var(--primary);font-weight:700}

/* ============================================================
   ★★ КОМПАКТНЫЙ ЖУРНАЛ — ВЕСЬ ГОД
============================================================ */
.journal-shell{
  display:flex;flex-direction:column;
  height:calc(100vh - 100px);
  background:var(--bg-elev);border-radius:var(--radius);
  border:1px solid var(--border);box-shadow:var(--shadow);
  overflow:hidden;
}
@media (max-width:768px){.journal-shell{height:calc(100vh - 120px)}}
.journal-top{
  display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;
  padding:10px 14px;background:var(--bg-elev);border-bottom:1px solid var(--border);
}
.journal-top .filter{display:flex;flex-direction:column;gap:3px;min-width:120px}
.journal-top .filter label{font-size:9px;text-transform:uppercase;color:var(--text-muted);font-weight:700;letter-spacing:.05em}
.journal-top select{padding:6px 10px;font-size:12px;min-width:120px}
.journal-top .btn{padding:6px 11px;font-size:12px}
.journal-sub{
  padding:6px 14px;background:var(--bg);border-bottom:1px solid var(--border);
  font-size:11px;color:var(--text-muted);display:flex;gap:12px;flex-wrap:wrap;
}
.journal-sub b{color:var(--text);font-weight:700}
.journal-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.j-table{
  border-collapse:separate;border-spacing:0;font-size:11px;
  width:max-content;min-width:100%;font-variant-numeric:tabular-nums;
}
.j-table th,.j-table td{
  border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:1px 2px;text-align:center;background:var(--bg-elev);
  white-space:nowrap;height:24px;line-height:22px;
}
.j-table thead th{
  background:var(--bg);font-weight:700;font-size:10px;
  color:var(--text-muted);position:sticky;z-index:2;padding:0 3px;
}
.j-table thead tr:nth-child(1) th{top:0;height:20px;font-size:10px;font-weight:800;color:var(--text)}
.j-table thead tr:nth-child(2) th{top:20px;height:22px;font-size:11px;color:var(--text);font-weight:700}
.j-table thead tr:nth-child(3) th{top:42px;height:16px;font-size:8px;font-weight:700;color:var(--text-muted);letter-spacing:.02em}
.j-table .col-num{
  position:sticky;left:0;z-index:3;
  width:26px;min-width:26px;max-width:26px;
  font-size:10px;color:var(--text-muted);font-weight:600;background:var(--bg-elev);
}
.j-table .col-name{
  position:sticky;left:26px;z-index:3;
  width:150px;min-width:150px;max-width:150px;
  text-align:left;padding-left:8px;font-size:11px;font-weight:500;
  background:var(--bg-elev);overflow:hidden;text-overflow:ellipsis;
}
.j-table thead .col-num,.j-table thead .col-name{z-index:5;background:var(--bg)}
.j-table .col-avg{
  position:sticky;right:44px;z-index:3;
  width:44px;min-width:44px;
  font-weight:800;font-size:11px;background:var(--bg-elev);
}
.j-table .col-final{
  position:sticky;right:0;z-index:3;
  width:44px;min-width:44px;
  font-weight:800;font-size:12px;background:var(--bg-elev);
}
.j-table thead .col-avg,.j-table thead .col-final{z-index:5;background:var(--bg)}
.j-table td.date-cell{padding:0 1px;min-width:26px;width:26px}
.j-cell{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:5px;
  font-weight:800;color:#fff;font-size:11px;
  cursor:pointer;transition:transform .12s ease;
}
.j-cell:hover{transform:scale(1.15);box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:10;position:relative}
.j-cell.empty{
  background:transparent;border:1px dashed rgba(148,163,184,.4);color:transparent;
}
.j-cell.empty:hover{border-color:var(--primary);background:rgba(14,165,233,.1);color:var(--primary)}
.j-cell.empty::after{content:'+';font-size:12px;font-weight:600;opacity:0}
.j-cell.empty:hover::after{opacity:1}
.g5{background:#10B981}
.g4{background:#84CC16}
.g3{background:#F59E0B}
.g2{background:#EF4444}
.g1{background:#991B1B}
.j-table .date-h{cursor:pointer;transition:background var(--transition);padding:0 2px;min-width:26px}
.j-table .date-h:hover{background:rgba(14,165,233,.15);color:var(--primary)}
.j-table .date-h.weekend{color:#EF4444}
.j-table .date-h.today{background:linear-gradient(135deg,rgba(14,165,233,.18),rgba(168,85,247,.12));color:var(--primary);font-weight:800}
.j-table .month-h{
  background:linear-gradient(180deg,var(--bg) 0%,rgba(14,165,233,.06) 100%)!important;
  font-weight:800;color:var(--text)!important;font-size:10px!important;
  letter-spacing:.03em;padding:0 2px;
}
.g-avg-5{color:#10B981}
.g-avg-4{color:#65A30D}
.g-avg-3{color:#D97706}
.g-avg-2{color:#DC2626}
.g-avg-1{color:#991B1B}
.lesson-tip{
  position:absolute;z-index:100;background:var(--bg-elev);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;
  box-shadow:var(--shadow-lg);max-width:240px;font-size:11px;line-height:1.4;
  pointer-events:none;animation:fadeIn .15s ease;
}
.lesson-tip .tip-title{font-size:9px;text-transform:uppercase;color:var(--text-muted);font-weight:700;letter-spacing:.05em;margin-bottom:2px}
.lesson-tip .tip-body{color:var(--text);margin-bottom:6px}
.lesson-tip .tip-body:last-child{margin-bottom:0}
.grade-picker{display:flex;gap:8px;flex-wrap:wrap}
.grade-btn{
  width:44px;height:44px;border-radius:10px;border:2px solid var(--border);
  background:var(--bg);color:var(--text);font-size:16px;font-weight:800;
  cursor:pointer;transition:var(--transition);
  display:inline-flex;align-items:center;justify-content:center;
}
.grade-btn:hover{transform:translateY(-2px);border-color:var(--primary)}
.grade-btn.active{color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.grade-btn.active.gb-5{background:#10B981}
.grade-btn.active.gb-4{background:#84CC16}
.grade-btn.active.gb-3{background:#F59E0B}
.grade-btn.active.gb-2{background:#EF4444}
.grade-btn.active.gb-1{background:#991B1B}
.weekday-picker{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.weekday-picker label{
  padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;
  cursor:pointer;font-size:12px;font-weight:600;transition:var(--transition);
}
.weekday-picker label input{display:none}
.weekday-picker label.on{background:linear-gradient(135deg,var(--primary),#38BDF8);color:#fff;border-color:transparent}
</style>
</head>
<body>

const SESSION_KEY = 'ej_session_v1';
function getSession() {
  try { const r = localStorage.getItem(SESSION_KEY); return r ? JSON.parse(r) : null; }
  catch (e) { return null; }
}
function setSession(u, p) { localStorage.setItem(SESSION_KEY, JSON.stringify({ user:u, profile:p })); }
function clearSession() { localStorage.removeItem(SESSION_KEY); }

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const el = (tag, props = {}, ...children) => {
  const n = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v);
  });
  children.flat().forEach(c => n.append(c?.nodeType ? c : document.createTextNode(c ?? '')));
  return n;
};

const TOAST_ICONS = { success:'checkCircle', error:'xCircle', warning:'alertCircle', info:'info' };
function toast(msg, type = 'info') {
  const t = el('div', { class:`toast ${type}`, html:`${ic(TOAST_ICONS[type]||'info', 18)}<div>${msg}</div>` });
  $('#toast-root').appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

function showModal(title, bodyHtml, actions = [], opts = {}) {
  const root = $('#modal-root');
  root.innerHTML = '';
  const backdrop = el('div', { class:'modal-backdrop' });
  backdrop.innerHTML = `
    <div class="modal ${opts.wide ? 'modal-wide' : ''}">
      <h3 class="modal-title">${title}</h3>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-actions"></div>
    </div>`;
  const actionsEl = backdrop.querySelector('.modal-actions');
  actions.forEach(a => {
    const b = el('button', {
      class:`btn ${a.class || 'btn-ghost'}`,
      onclick: () => a.onClick ? a.onClick(backdrop) : closeModal()
    }, a.label);
    actionsEl.appendChild(b);
  });
  backdrop.onclick = e => { if (e.target === backdrop) closeModal(); };
  root.appendChild(backdrop);
  return backdrop;
}
function closeModal() { $('#modal-root').innerHTML = ''; }

function confirmDialog(title, message) {
  return new Promise(res => {
    showModal(`${ic('alertCircle', 20)} ${title}`, `<p>${message}</p>`, [
      { label:'Отмена', onClick:() => { closeModal(); res(false); } },
      { label:'Подтвердить', class:'btn-danger', onClick:() => { closeModal(); res(true); } }
    ]);
  });
}

  const n = Math.round(v);
  if (n >= 5) return 'g5';

  if (n === 2) return 'g2';

}

function initTheme() {
  const t = localStorage.getItem('theme') || 'light';
  document.documentElement.dataset.theme = t;
  const btn = $('#theme-toggle');
  if (btn) {
    btn.innerHTML = t === 'dark' ? ic('sun', 16) : ic('moon', 16);
    btn.onclick = () => {
      const cur = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = cur;
      localStorage.setItem('theme', cur);
      btn.innerHTML = cur === 'dark' ? ic('sun', 16) : ic('moon', 16);
    };
  }
}

  const e = $('#auth-message');
  e.textContent = text;

  setTimeout(() => { e.className = 'auth-message'; }, 6000);
}

    tab.classList.add('active');

$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const loginInput = $('#login-input').value.trim();
  const password = $('#login-password').value;
  if (!loginInput || !password) return;

  // Хардкод-админ
  if (loginInput === HARDCODED_ADMIN.login && password === HARDCODED_ADMIN.password) {
    const user = { uid:'admin-local', email:HARDCODED_ADMIN.profile.email };
    const profile = { ...HARDCODED_ADMIN.profile, createdAt:Date.now() };
    setSession(user, profile);
    startApp(user, profile);
    return;
  }

  try {
    let email = loginInput;
    if (!loginInput.includes('@')) {
      const snap = await db.ref('users').orderByChild('login').equalTo(loginInput).once('value');
      if (!snap.exists()) return showAuthMsg('Пользователь с таким логином не найден');
      email = Object.values(snap.val())[0].email;
    }
    await auth.signInWithEmailAndPassword(email, password);
  } catch (err) {
    showAuthMsg(translateError(err));
  }
});

$('#register-form').addEventListener('submit', async e => {
  e.preventDefault();
  const code = $('#invite-code').value.trim().toUpperCase();
  const name = $('#reg-name').value.trim();
  const login = $('#reg-login').value.trim();
  const email = $('#reg-email').value.trim();
  const password = $('#reg-password').value;

  try {
    const iSnap = await db.ref('invites/' + code).once('value');
    if (!iSnap.exists()) return showAuthMsg('Неверный код приглашения');
    const invite = iSnap.val();
    if (invite.used) return showAuthMsg('Код уже использован');
    if (invite.expiresAt && invite.expiresAt < Date.now()) return showAuthMsg('Код истёк');

    const lCheck = await db.ref('users').orderByChild('login').equalTo(login).once('value');
    if (lCheck.exists()) return showAuthMsg('Такой логин уже занят');

    const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    await secondaryAuth.signOut();

    await db.ref('users/' + uid).set({
      role: invite.role || 'teacher',
      login, name, email,
      schoolId: invite.schoolId || null,
      cityId: invite.cityId || null,
      createdAt: Date.now()
    });

    await db.ref('invites/' + code).update({ used:true, usedBy:uid, usedAt:Date.now() });
    showAuthMsg('Регистрация успешна! Входим…', 'success');
    setTimeout(async () => { await auth.signInWithEmailAndPassword(email, password); }, 800);
  } catch (err) {
    showAuthMsg(translateError(err));
  }
});

$('#forgot-password').onclick = async e => {
  e.preventDefault();
  const v = prompt('Введите ваш email для сброса пароля:');
  if (!v) return;
  try {
    await auth.sendPasswordResetEmail(v.trim());
    showAuthMsg('Письмо отправлено. Проверьте почту.', 'success');
  } catch (err) { showAuthMsg(translateError(err)); }
};

function buildMenu() {
  const nav = $('#sidebar-nav');
  nav.innerHTML = '';
  (MENU[App.profile.role] || []).forEach(it => {
    nav.appendChild(el('div', {
      class:'nav-item' + (location.hash === '#' + it.id ? ' active' : ''),
      html: ic(it.icon, 18) + `<span>${it.label}</span>`,
      onclick: () => navigate(it.id)
    }));
  });
}

function navigate(view, params = {}) {
  location.hash = '#' + view + (params.id ? '/' + params.id : '');
  router();
}

async function router() {
  const hash = location.hash.slice(1) || 'dashboard';
  const [view, id] = hash.split('/');
  if (!App.profile) return;

  const items = MENU[App.profile.role] || [];
  const allowed = items.map(i => i.id);
  ['class'].forEach(v => { if (!allowed.includes(v)) allowed.push(v); });
  if (!allowed.includes(view)) return navigate('dashboard');

  $$('.nav-item').forEach(n => n.classList.remove('active'));
  const idx = items.findIndex(i => i.id === view);
  if (idx >= 0) $$('.nav-item')[idx]?.classList.add('active');

  const renderers = {
    dashboard: renderDashboard, cities: renderCities, schools: renderSchools,
    users: renderUsers, invites: renderInvites, classes: renderClasses,
    class: () => renderClassDetail(id), journal: renderJournal,
    students: renderStudents, worktypes: renderWorkTypes, profile: renderProfile
  };
  const fn = renderers[view];
  if (fn) await fn();
  $('#sidebar').classList.remove('open');
}
window.addEventListener('hashchange', router);

async function loadAll() {
  const [cities, schools, classes, students, grades, workTypes, invites, users, lessons] =
    await Promise.all([
      db.ref('cities').once('value'),
      db.ref('schools').once('value'),
      db.ref('classes').once('value'),
      db.ref('students').once('value'),
      db.ref('grades').once('value'),
      db.ref('workTypes').once('value'),
      db.ref('invites').once('value'),
      db.ref('users').once('value'),
      db.ref('lessons').once('value')
    ]);
  App.cache.cities    = cities.val()    || {};
  App.cache.schools   = schools.val()   || {};
  App.cache.classes   = classes.val()   || {};
  App.cache.students  = students.val()  || {};
  App.cache.grades    = grades.val()    || {};
  App.cache.workTypes = workTypes.val() || {};
  App.cache.invites   = invites.val()   || {};
  App.cache.users     = users.val()     || {};
  App.cache.lessons   = lessons.val()   || {};
}

async function bootstrapDefaultWorkTypes() {
  try {
    const snap = await db.ref('workTypes').once('value');
    if (snap.exists() && Object.keys(snap.val()).length > 0) return;
    const updates = {};
    DEFAULT_WORK_TYPES.forEach(wt => {
      const id = db.ref('workTypes').push().key;
      updates['workTypes/' + id] = {
        name: wt.name, weight: wt.weight, code: wt.code,
        createdBy: App.user.uid, createdAt: Date.now()
      };
    });
    await db.ref().update(updates);
    const fresh = await db.ref('workTypes').once('value');
    App.cache.workTypes = fresh.val() || {};
  } catch (e) { console.warn(e); }
}

function mySchools() {
  const s = App.cache.schools;
  if (App.profile.role === 'super_admin') return s;
  if (App.profile.role === 'city_creator')
    return Object.fromEntries(Object.entries(s).filter(([,v]) => v.cityId === App.profile.cityId));
  if (App.profile.role === 'school_creator' || App.profile.role === 'teacher')
    return Object.fromEntries(Object.entries(s).filter(([k]) => k === App.profile.schoolId));
  return {};
}
function myClasses() {
  return Object.fromEntries(
    Object.entries(App.cache.classes).filter(([,c]) => c.teacherId === App.user.uid)
  );
}

async function renderDashboard() {
  $('#page-title').textContent = 'Дашборд';
  const c = $('#content'); c.innerHTML = '';
  const role = App.profile.role;
  let stats = [];

  if (role === 'super_admin') {
    stats = [
      { label:'Городов',       value:Object.keys(App.cache.cities).length },
      { label:'Школ',          value:Object.keys(App.cache.schools).length },
      { label:'Пользователей', value:Object.keys(App.cache.users).length }
    ];
  } else if (role === 'city_creator') {
    stats = [
      { label:'Школ в городе', value:Object.keys(mySchools()).length },
      { label:'Пользователей', value:Object.values(App.cache.users).filter(u => u.cityId === App.profile.cityId).length }
    ];
  } else if (role === 'school_creator') {
    const su = Object.values(App.cache.users).filter(u => u.schoolId === App.profile.schoolId);
    stats = [
      { label:'Учителей', value:su.filter(u => u.role === 'teacher').length },
      { label:'Классов',  value:Object.values(App.cache.classes).filter(cl => cl.schoolId === App.profile.schoolId).length },
      { label:'Учеников', value:countStudentsBySchool() }
    ];
  } else if (role === 'teacher') {
    stats = [
      { label:'Моих классов',      value:Object.keys(myClasses()).length },
      { label:'Моих учеников',     value:countStudentsInMyClasses() },
      { label:'Оценок выставлено', value:countMyGrades() }
    ];
  }

  const g = el('div', { class:'grid grid-3' });
  stats.forEach(s => {
    g.appendChild(el('div', { class:'stat-card' },
      el('div', { class:'stat-label' }, s.label),
      el('div', { class:'stat-value' }, String(s.value))
    ));
  });
  c.appendChild(g);
}

  $('#page-title').textContent = `Класс ${cl.name}`;
  const c = $('#content'); c.innerHTML = '';

  const info = el('div', { class:'card' });
  info.innerHTML = `
    <div class="card-header"><div class="card-title">${cl.name} • ${cl.year||''} год</div></div>
    <div style="font-size:13px;color:var(--text-muted);display:flex;gap:10px;">
      <span>${ic('book',16)}</span>
      <span><b>Предметы:</b> ${(cl.subjects||[]).join(', ') || '—'}</span>
    </div>`;
  c.appendChild(info);

  const card = el('div', { class:'card' });
  card.appendChild(el('div', { class:'card-header' },

    el('button', { class:'btn btn-primary btn-sm', html:ic('userPlus',14)+' Добавить учеников', onclick:() => addStudentDialog(classId) })

  const st = Object.entries(App.cache.students).filter(([,s]) => s.classId === classId);
  if (!st.length) card.appendChild(el('div', { class:'empty' }, 'Учеников пока нет'));
  else {
    const t = el('table');
    t.innerHTML = `<thead><tr><th>#</th><th>ФИО</th><th></th></tr></thead>`;
    const tb = el('tbody');
    st.sort((a,b) => a[1].name.localeCompare(b[1].name)).forEach(([sid,s],i) => {
      const tr = el('tr');
      tr.innerHTML = `<td>${i+1}</td><td>${s.name}</td>`;

      tr.appendChild(a); tb.appendChild(tr);
    });
    t.appendChild(tb); card.appendChild(t);
  }
  c.appendChild(card);
  c.appendChild(el('button', { class:'btn btn-ghost', html:ic('arrowLeft',16)+' Назад', onclick:() => navigate('classes') }));
}

async function renderJournal() {
  $('#page-title').textContent = 'Журнал';
  const c = $('#content'); c.innerHTML = '';
  const classes = myClasses();
  if (!Object.keys(classes).length) {
    c.appendChild(el('div', { class:'card empty' }, 'Сначала создайте класс'));
    return;
  }

  const state = App._journalState = App._journalState || { classId:Object.keys(classes)[0], subject:null };
  if (!classes[state.classId]) state.classId = Object.keys(classes)[0];
  const curCls = classes[state.classId];
  const subs = curCls.subjects || [];
  if (!state.subject || !subs.includes(state.subject)) state.subject = subs[0] || null;

  const shell = el('div', { class:'journal-shell' });

  // Панель фильтров
  const top = el('div', { class:'journal-top' });
  top.appendChild(el('div', { class:'filter' },
    el('label', {}, 'Класс'),
    (() => {
      const s = el('select');
      Object.entries(classes).forEach(([id,cl]) => s.appendChild(new Option(cl.name, id)));
      s.value = state.classId;
      s.onchange = () => { state.classId = s.value; state.subject = null; renderJournal(); };
      return s;
    })()
  ));
  top.appendChild(el('div', { class:'filter' },
    el('label', {}, 'Предмет'),
    (() => {
      const s = el('select');
      subs.forEach(x => s.appendChild(new Option(x, x)));
      s.value = state.subject || '';
      s.onchange = () => { state.subject = s.value; renderJournal(); };
      return s;
    })()
  ));
  top.appendChild(el('button', { class:'btn btn-primary', html:ic('zap',14)+' Заполнить год', onclick:() => fillYearDialog(state.classId, state.subject) }));
  top.appendChild(el('button', { class:'btn btn-primary', html:ic('plus',14)+' Урок', onclick:() => openLessonDialog({ classId:state.classId, subject:state.subject }) }));
  top.appendChild(el('button', { class:'btn btn-ghost', html:ic('download',14)+' CSV', onclick:() => exportJournalCSV(state.classId, state.subject) }));
  shell.appendChild(top);

  // Инфо
  const tname = App.profile.name || App.profile.login || '—';
  const sub = el('div', { class:'journal-sub' });
  sub.innerHTML = `<span><b>Класс:</b> ${curCls.name}</span><span><b>Предмет:</b> ${state.subject||'—'}</span><span><b>Учитель:</b> ${tname}</span>`;
  shell.appendChild(sub);

  // Скролл
  const scroll = el('div', { class:'journal-scroll' });
  const table = buildJournalTable(state.classId, state.subject);
  if (table) scroll.appendChild(table);
  else scroll.appendChild(el('div', { class:'empty' }, 'Нет данных — добавьте учеников или уроки'));
  shell.appendChild(scroll);
  c.appendChild(shell);
}

function buildJournalTable(classId, subject) {
  const students = Object.entries(App.cache.students)
    .filter(([,s]) => s.classId === classId)
    .sort((a,b) => a[1].name.localeCompare(b[1].name));
  if (!students.length) return null;

  const lessons = Object.entries(App.cache.lessons)
    .filter(([,l]) => l.classId === classId && l.subject === subject)
    .map(([id,l]) => ({ id, ...l, dms:new Date(l.date).setHours(0,0,0,0) }))
    .sort((a,b) => a.dms - b.dms);

  const grades = Object.entries(App.cache.grades)
    .filter(([,g]) => g.classId === classId && g.subject === subject)
    .map(([id,g]) => ({ id, ...g, dms:new Date(g.date).setHours(0,0,0,0) }));

  const allDates = [...new Set([...lessons.map(l=>l.dms), ...grades.map(g=>g.dms)])].sort((a,b) => a-b);

  if (!allDates.length) {
    const w = el('div');
    w.innerHTML = `<div class="empty" style="padding:60px;">
      <div style="font-size:14px;margin-bottom:6px;">Журнал пуст</div>
      <div style="font-size:12px;">Нажмите «Заполнить год» или «+ Урок»</div>
    </div>`;
    return w;
  }

  // Группировка дат по месяцам
  const mm = new Map();
  allDates.forEach(dms => {
    const d = new Date(dms);
    const k = d.getFullYear() + '-' + d.getMonth();
    if (!mm.has(k)) mm.set(k, { name:d.toLocaleDateString('ru-RU', {month:'long'}), dates:[] });
    mm.get(k).dates.push(dms);
  });

  const gIdx = new Map();
  grades.forEach(g => gIdx.set(g.studentId + '_' + g.dms, g));
  const lIdx = new Map();
  lessons.forEach(l => lIdx.set(l.dms, l));

  const table = el('table', { class:'j-table' });
  const thead = el('thead');

  // Строка 1: месяцы
  const tr1 = el('tr');
  tr1.appendChild(el('th', { class:'col-num', rowspan:'3' }, '№'));
  tr1.appendChild(el('th', { class:'col-name', rowspan:'3' }, 'Ф.И. ученика'));
  mm.forEach(m => tr1.appendChild(el('th', { class:'month-h', colspan:String(m.dates.length) }, m.name)));
  tr1.appendChild(el('th', { class:'col-avg', rowspan:'3' }, 'Средний'));
  tr1.appendChild(el('th', { class:'col-final', rowspan:'3' }, 'Итог'));
  thead.appendChild(tr1);

  // Строка 2: даты
  const tr2 = el('tr');
  const today = new Date().setHours(0,0,0,0);
  allDates.forEach(dms => {
    const d = new Date(dms);
    const we = d.getDay() === 0 || d.getDay() === 6;
    const isT = dms === today;
    const cls = 'date-h' + (we ? ' weekend' : '') + (isT ? ' today' : '');
    const th = el('th', { class:cls });
    th.textContent = String(d.getDate());
    th.onclick = () => openLessonDialog({ classId, subject, dateMs:dms });
    const l = lIdx.get(dms);
    if (l && (l.topic || l.homework)) {
      th.onmouseenter = e => showLessonTip(e.target, l);
      th.onmouseleave = hideLessonTip;
    }
    tr2.appendChild(th);
  });
  thead.appendChild(tr2);

  // Строка 3: код типа
  const tr3 = el('tr');
  allDates.forEach(dms => {
    const dayG = grades.filter(g => g.dms === dms);
    let code = '—';
    if (dayG.length) {
      const w = App.cache.workTypes[dayG[0].typeId];
      code = w?.code || (w?.name ? w.name.substring(0,3).toUpperCase() : '—');
    }
    tr3.appendChild(el('th', {}, code));
  });
  thead.appendChild(tr3);
  table.appendChild(thead);

  // Тело
  const tbody = el('tbody');
  students.forEach(([sid,s], idx) => {
    const tr = el('tr');
    tr.appendChild(el('td', { class:'col-num' }, String(idx+1)));
    tr.appendChild(el('td', { class:'col-name', title:s.name }, s.name));

    allDates.forEach(dms => {
      const td = el('td', { class:'date-cell' });
      const g = gIdx.get(sid + '_' + dms);
      if (g) {
        const cell = el('div', {
          class:`j-cell ${gradeClass(g.value)}`,
          title:`${App.cache.workTypes[g.typeId]?.name||''}\n${fmt.date(g.date)}`
        }, String(g.value));
        cell.onclick = () => openGradeCellDialog(classId, subject, sid, dms, g.id);
        td.appendChild(cell);
      } else {
        const cell = el('div', { class:'j-cell empty', title:'Поставить оценку' });
        cell.onclick = () => openGradeCellDialog(classId, subject, sid, dms);
        td.appendChild(cell);
      }
      tr.appendChild(td);
    });

    const sg = Object.values(App.cache.grades).filter(g => g.studentId === sid && g.classId === classId && g.subject === subject);
    const avg = weightedAvg(sg);
    tr.appendChild(el('td', { class:'col-avg '+avgClass(avg) }, avg ? String(avg) : '—'));
    tr.appendChild(el('td', { class:'col-final '+avgClass(avg) }, avg ? String(Math.round(avg)) : '—'));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

let _tipEl = null;
function showLessonTip(target, lesson) {
  hideLessonTip();
  const r = target.getBoundingClientRect();
  const tip = el('div', { class:'lesson-tip' });
  tip.innerHTML = `
    <div class="tip-title">Тема урока</div>

    <div class="tip-title">Домашняя работа</div>

}

/* ★ Заполнить год — автосоздание уроков по дням недели */
function fillYearDialog(classId, subject) {
  const curY = new Date().getFullYear();
  const curM = new Date().getMonth();
  const startYear = curM >= 7 ? curY : curY - 1;
  const start = `${startYear}-09-01`;
  const end = `${startYear+1}-05-31`;
  const wd = ['Пн','Вт','Ср','Чт','Пт','Сб'];

  showModal(`${ic('zap',20)} Заполнить уроки на год`, `
    <div class="form-group"><label>Класс / Предмет</label>
      <input value="${App.cache.classes[classId].name} / ${subject}" disabled></div>
    <div class="form-group"><label>Дата начала</label>
      <input type="date" id="fy-start" value="${start}"></div>
    <div class="form-group"><label>Дата окончания</label>
      <input type="date" id="fy-end" value="${end}"></div>
    <div class="form-group">
      <label>Дни недели уроков</label>
      <div class="weekday-picker" id="fy-wd">
        ${wd.map((w,i) => `<label data-wd="${i+1}"><input type="checkbox" value="${i+1}">${w}</label>`).join('')}
      </div>
      <div class="hint">${ic('info',14)} Отметьте дни, когда проходят уроки по этому предмету.</div>
    </div>
  `, [
    { label:'Отмена' },
    { label:'Создать уроки', class:'btn-primary', onClick: async () => {
      const s = document.getElementById('fy-start').value;
      const e = document.getElementById('fy-end').value;
      const checked = [...document.querySelectorAll('#fy-wd label.on')].map(l => +l.dataset.wd);
      if (!s || !e || !checked.length) return toast('Заполните даты и выберите дни', 'error');

      const u = {};
      let cur = new Date(s);
      const end = new Date(e);
      let cnt = 0;
      while (cur <= end) {
        const wd = cur.getDay(); // 0..6
        if (checked.includes(wd)) {
          const dms = cur.setHours(0,0,0,0);
          const exists = Object.values(App.cache.lessons).some(l =>
            l.classId === classId && l.subject === subject &&
            new Date(l.date).setHours(0,0,0,0) === dms
          );
          if (!exists) {
            const id = db.ref('lessons').push().key;
            u['lessons/' + id] = {
              classId, subject,
              teacherId: App.user.uid,
              date: dms, topic:'', homework:'',
              createdAt: Date.now()
            };
            cnt++;
          }
        }
        cur.setDate(cur.getDate() + 1);
      }

      if (!cnt) { closeModal(); return toast('Все уроки уже есть', 'warning'); }

      const keys = Object.keys(u);
      const chunks = [];
      for (let i = 0; i < keys.length; i += 200) {
        const ch = {};
        keys.slice(i, i+200).forEach(k => ch[k] = u[k]);
        chunks.push(ch);
      }
      try {
        for (const ch of chunks) await db.ref().update(ch);
        closeModal();
        toast(`Создано уроков: <b>${cnt}</b>`, 'success');
        await loadAll(); renderJournal();
      } catch (err) {
        toast('Ошибка: ' + err.message, 'error');
      }
    }}
  ], { wide:true });

  setTimeout(() => {
    document.querySelectorAll('#fy-wd label').forEach(l => {
      l.onclick = e => {
        e.preventDefault();
        const cb = l.querySelector('input');
        cb.checked = !cb.checked;
        l.classList.toggle('on', cb.checked);
      };
    });
  }, 50);
}

function openGradeCellDialog(classId, subject, studentId, dateMs, existingGradeId) {
  const student = App.cache.students[studentId];
  const cls = App.cache.classes[classId];
  const existing = existingGradeId ? App.cache.grades[existingGradeId] : null;
  const dateStr = new Date(dateMs).toISOString().slice(0,10);

  const wt = Object.entries(App.cache.workTypes).sort((a,b) => (a[1].weight||0) - (b[1].weight||0));
  if (!wt.length) return toast('Сначала создайте типы работ', 'warning');

  let selectedValue = existing ? existing.value : null;
  const wtOpts = wt.map(([id,w]) =>
    `<option value="${id}" ${existing && existing.typeId === id ? 'selected' : ''}>${w.name} (вес ${w.weight})</option>`
  ).join('');

  const btns = [5,4,3,2,1].map(v => {
    const a = (existing ? existing.value : null) === v ? 'active' : '';
    return `<button type="button" class="grade-btn gb-${v} ${a}" data-value="${v}">${v}</button>`;
  }).join('');

  showModal(`${ic('pencil',20)} Оценка`, `
    <div class="form-group"><label>Класс / Предмет</label>
      <input value="${cls.name} / ${subject}" disabled></div>
    <div class="form-group"><label>Ученик</label>
      <input value="${student.name}" disabled></div>
    <div class="form-group"><label>Дата</label>
      <input type="date" id="gd-date" value="${dateStr}"></div>
    <div class="form-group"><label>Тип работы</label>
      <select id="gd-type">${wtOpts}</select></div>
    <div class="form-group"><label>Оценка *</label>
      <div class="grade-picker" id="gd-picker">${btns}</div></div>
    <div class="form-group"><label>Замечания</label>
      <textarea id="gd-notes" placeholder="Комментарий…">${existing?.notes||''}</textarea></div>
  `, [
    ...(existing ? [{ label:'Удалить', class:'btn-danger', onClick: async () => {
      if (await confirmDialog('Удалить оценку?', 'Необратимо.')) {
        await db.ref('grades/' + existingGradeId).remove();
        toast('Оценка удалена', 'success');
        closeModal(); await loadAll(); renderJournal();
      }
    }}] : []),
    { label:'Отмена' },
    { label:'Сохранить', class:'btn-primary', onClick: async () => {
      if (!selectedValue) return toast('Выберите оценку', 'error');
      const date = document.getElementById('gd-date').value;
      const typeId = document.getElementById('gd-type').value;
      const notes = document.getElementById('gd-notes').value.trim();
      const w = App.cache.workTypes[typeId];
      const gd = new Date(date).setHours(0,0,0,0);

      if (existing) {
        const hist = [...(existing.history||[])];
        if (existing.value !== selectedValue) {
          hist.push({
            changedBy:App.user.uid, changedAt:Date.now(),
            oldValue:existing.value, newValue:selectedValue
          });
        }
        await db.ref('grades/' + existingGradeId).update({
          value: selectedValue, date: gd, typeId, weight: w.weight, notes, history: hist
        });
        toast('Оценка обновлена', 'success');
      } else {
        const gid = db.ref('grades').push().key;
        await db.ref('grades/' + gid).set({
          studentId, classId, subject,
          teacherId: App.user.uid,
          date: gd, typeId, weight: w.weight,
          value: selectedValue, notes, history:[]
        });
        toast('Оценка выставлена', 'success');
      }
      closeModal();
      await loadAll(); renderJournal();
    }}
  ]);

  setTimeout(() => {
    const p = document.getElementById('gd-picker');
    p.querySelectorAll('.grade-btn').forEach(b => {
      b.onclick = () => {
        p.querySelectorAll('.grade-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        selectedValue = +b.dataset.value;
      };
    });
  }, 50);
}

function exportJournalCSV(classId, subject) {
  const cls = App.cache.classes[classId];
  const st = Object.entries(App.cache.students).filter(([,s]) => s.classId === classId)
    .sort((a,b) => a[1].name.localeCompare(b[1].name));
  const g = Object.entries(App.cache.grades)
    .filter(([,x]) => x.classId === classId && x.subject === subject)
    .map(([id,x]) => ({ id, ...x, dms:new Date(x.date).setHours(0,0,0,0) }));
  const ds = [...new Set(g.map(x => x.dms))].sort((a,b) => a-b);

  let csv = `Журнал ${cls.name} / ${subject}\n`;
  csv += '№;Ученик;' + ds.map(d => new Date(d).toLocaleDateString('ru-RU')).join(';') + ';Средний\n';

  st.forEach(([sid,s], i) => {
    const row = [i+1, s.name];
    ds.forEach(d => {
      const x = g.find(y => y.studentId === sid && y.dms === d);
      row.push(x ? x.value : '');
    });
    const sg = g.filter(x => x.studentId === sid);
    row.push(weightedAvg(sg) || '');
    csv += row.join(';') + '\n';
  });

  const b = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u;
  a.download = `journal_${cls.name}_${subject}.csv`;
  a.click();
  URL.revokeObjectURL(u);
}

function addClassDialog() {
  const gh = POPULAR_SUBJECTS.map((g, gi) => `
    <div class="subject-group" data-group="${gi}">
      <div class="subject-group-title">${ic('list',12)} ${g.group}</div>
      ${g.items.map(n => `
        <label class="subject-item" data-name="${n}">
          <input type="checkbox" value="${n}"><span>${n}</span>
        </label>`).join('')}
    </div>`).join('');

  const d = showModal(`${ic('cap',20)} Новый класс`, `
    <div class="form-group"><label>Название</label>
      <input id="m-cl-name" placeholder="1А"></div>
    <div class="form-group"><label>Год</label>
      <input id="m-cl-year" type="number" value="${new Date().getFullYear()}"></div>
    <div class="form-group">
      <label>Предметы</label>
      <div class="subjects-toolbar">
        <input type="text" id="m-cl-search" placeholder="Поиск...">
        <button type="button" class="btn btn-sm btn-ghost" id="m-cl-all">Все</button>
        <button type="button" class="btn btn-sm btn-ghost" id="m-cl-clr">Снять</button>
      </div>
      <div class="subjects-box" id="m-cl-box">${gh}</div>
      <div class="subject-counter">Выбрано: <b id="m-cl-counter">0</b></div>
    </div>
  `, [
    { label:'Отмена' },
    { label:'Создать', class:'btn-primary', onClick: async () => {
      const n = document.getElementById('m-cl-name').value.trim();
      const y = +document.getElementById('m-cl-year').value;
      const subs = [...d.querySelectorAll('.subject-item input:checked')].map(c => c.value);
      if (!n) return toast('Введите название', 'error');
      if (!subs.length) return toast('Выберите предметы', 'error');
      const id = db.ref('classes').push().key;
      await db.ref('classes/' + id).set({
        name:n, year:y, subjects:subs,
        teacherId:App.user.uid,
        schoolId:App.profile.schoolId || null,
        createdAt:Date.now()
      });
      closeModal();
      toast(`Класс создан, предметов: <b>${subs.length}</b>`, 'success');
      await loadAll(); renderClasses();
    }}
  ], { wide:true });

  setTimeout(() => {
    const search = d.querySelector('#m-cl-search');
    const counter = d.querySelector('#m-cl-counter');
    const items = d.querySelectorAll('.subject-item');
    const upd = () => counter.textContent = d.querySelectorAll('.subject-item input:checked').length;

    items.forEach(it => {
      const cb = it.querySelector('input');
      it.addEventListener('click', e => {
        if (e.target !== cb) cb.checked = !cb.checked;
        it.classList.toggle('checked', cb.checked);
        upd();
      });
      cb.addEventListener('change', () => {
        it.classList.toggle('checked', cb.checked);
        upd();
      });
    });

    search.oninput = () => {
      const q = search.value.toLowerCase().trim();
      items.forEach(it => {
        const m = !q || it.dataset.name.toLowerCase().includes(q);
        it.style.display = m ? '' : 'none';
      });
      d.querySelectorAll('.subject-group').forEach(g => {
        const vis = [...g.querySelectorAll('.subject-item')].some(i => i.style.display !== 'none');
        g.style.display = vis ? '' : 'none';
      });
    };

    d.querySelector('#m-cl-all').onclick = () => {
      items.forEach(i => {
        if (i.style.display !== 'none') {
          i.querySelector('input').checked = true;
          i.classList.add('checked');
        }
      });
      upd();
    };
    d.querySelector('#m-cl-clr').onclick = () => {
      items.forEach(i => {
        i.querySelector('input').checked = false;
        i.classList.remove('checked');
      });
      upd();
    };

    d.querySelector('#m-cl-name')?.focus();
    upd();
  }, 50);
}

async function deleteStudent(sid, name) {
  if (await confirmDialog('Удалить ученика?', `"${name}" будет удалён вместе с оценками.`)) {
    const u = { ['students/' + sid]: null };
    Object.entries(App.cache.grades).forEach(([gid,g]) => {
      if (g.studentId === sid) u['grades/' + gid] = null;
    });
    await db.ref().update(u);
    toast('Ученик удалён', 'success');
    await loadAll(); router();
  }
}

/* ============================================================
   ВЫЧИСЛЕНИЯ
============================================================ */
function weightedAvg(list) {
  const s = list.reduce((a,g) => a + g.value * g.weight, 0);
  const w = list.reduce((a,g) => a + g.weight, 0);
  return w ? Math.round(s / w * 100) / 100 : 0;
}
function avgForStudent(sid, cid) {
  return weightedAvg(Object.values(App.cache.grades).filter(g => g.studentId === sid && (!cid || g.classId === cid)));
}
function countStudentsBySchool() {
  const ids = Object.entries(App.cache.classes).filter(([,c]) => c.schoolId === App.profile.schoolId).map(([id]) => id);
  return Object.values(App.cache.students).filter(s => ids.includes(s.classId)).length;
}
function countStudentsInMyClasses() {
  const ids = Object.keys(myClasses());
  return Object.values(App.cache.students).filter(s => ids.includes(s.classId)).length;
}
function countMyGrades() {
  return Object.values(App.cache.grades).filter(g => g.teacherId === App.user.uid).length;
}

/* ============================================================
   ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
============================================================ */
function showLoader(text) {
  $('#loader-text').textContent = text || 'Загрузка…';
  $('#loader-screen').style.display = 'flex';
  $('#auth-screen').style.display = 'none';
  $('#app-screen').style.display = 'none';
}
function showAuth() {
  $('#loader-screen').style.display = 'none';
  $('#auth-screen').style.display = 'flex';
  $('#app-screen').style.display = 'none';
}
function showApp() {
  $('#loader-screen').style.display = 'none';
  $('#auth-screen').style.display = 'none';
  $('#app-screen').style.display = 'flex';
}

/* ============================================================
   СТАРТ
============================================================ */
async function startApp(user, profile) {
  App.user = user;
  App.profile = profile;
  showLoader('Загрузка данных…');
  $('#user-name').textContent = profile.name || profile.login || '';
  $('#user-role').textContent = roleLabel(profile.role);
  try {
    await loadAll();
    await bootstrapDefaultWorkTypes();
    buildMenu();
    showApp();
    if (!location.hash) location.hash = '#dashboard';
    router();
  } catch (err) {
    console.error(err);
    toast('Ошибка: ' + err.message, 'error');
    showApp();
  }
}

$('#logout-btn').onclick = async () => {
  const b = $('#logout-btn');
  b.disabled = true;
  b.innerHTML = ic('logout', 16) + ' Выход…';
  clearSession();
  App.user = null;
  App.profile = null;
  try { await auth.signOut(); } catch (e) {}
  location.reload();
};
$('#menu-toggle').onclick = () => $('#sidebar').classList.toggle('open');

/* ============================================================
   ВОССТАНОВЛЕНИЕ СЕССИИ
============================================================ */
(async () => {
  showLoader('Загрузка…');
  const s = getSession();
  if (s && s.user && s.profile) {
    await startApp(s.user, s.profile);
    return;
  }
  auth.onAuthStateChanged(async fbUser => {
    if (!fbUser) { showAuth(); return; }
    showLoader('Загрузка профиля…');
    try {
      const snap = await db.ref('users/' + fbUser.uid).once('value');
      if (!snap.exists()) {
        toast('Профиль не найден', 'error');
        await auth.signOut();
        showAuth();
        return;
      }
      const p = snap.val();
      setSession({ uid:fbUser.uid, email:fbUser.email }, p);
      await startApp({ uid:fbUser.uid, email:fbUser.email }, p);
    } catch (err) {
      console.error(err);
      toast('Ошибка: ' + err.message, 'error');
      showAuth();
    }
  });
})();
</script>
