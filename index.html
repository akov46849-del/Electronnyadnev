<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Класс Жур — электронный журнал</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='28' fill='%230EA5E9'/><path d='M25 40 Q60 30 60 40 Q60 30 95 40 L95 82 Q60 72 60 82 Q60 72 25 82 Z' fill='%23FFFFFF'/><line x1='60' y1='40' x2='60' y2='82' stroke='%230EA5E9' stroke-width='2'/><path d='M42 60 L56 74 L84 46' stroke='%23FACC15' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
<style>
:root{--bg:#F8FAFC;--bg-elev:#FFF;--text:#0F172A;--text-muted:#64748B;--border:#E2E8F0;--primary:#0EA5E9;--primary-hover:#0284C7;--accent:#A855F7;--danger:#EF4444;--success:#10B981;--warning:#F59E0B;--shadow:0 1px 3px rgba(15,23,42,.08);--shadow-lg:0 10px 25px rgba(14,165,233,.18);--radius:12px;--radius-lg:18px;--transition:.2s ease;--j-cell:22px;--j-row:22px;--j-font:10px;--j-head-font:10px;--j-name-w:140px;--j-num-w:24px;--j-avg-w:44px}
[data-theme="dark"]{--bg:#0F172A;--bg-elev:#1E293B;--text:#E2E8F0;--text-muted:#94A3B8;--border:#334155;--primary:#38BDF8;--accent:#C084FC;--shadow:0 1px 3px rgba(0,0,0,.4);--shadow-lg:0 10px 25px rgba(56,189,248,.25)}
html[data-device="phone"]{--j-cell:16px;--j-row:16px;--j-font:9px;--j-head-font:8px;--j-name-w:90px;--j-num-w:16px;--j-avg-w:32px}
html[data-device="tablet"]{--j-cell:22px;--j-row:22px;--j-font:10px;--j-name-w:140px;--j-num-w:24px;--j-avg-w:44px}
html[data-device="desktop"]{--j-cell:28px;--j-row:28px;--j-font:12px;--j-name-w:200px;--j-num-w:32px;--j-avg-w:58px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;transition:background var(--transition),color var(--transition)}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{flex-shrink:0;filter:drop-shadow(0 4px 10px rgba(14,165,233,.25))}
.brand-text{line-height:1.1}
.brand-name{font-size:16px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.brand-tag{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:2px}
.btn svg{flex-shrink:0}.nav-item svg{flex-shrink:0}.nav-item span{flex:1}
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#0EA5E9 0%,#38BDF8 40%,#A855F7 100%);position:relative;overflow:hidden}
#auth-screen::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,rgba(250,204,21,.15),transparent 45%),radial-gradient(circle at 85% 80%,rgba(168,85,247,.25),transparent 50%);pointer-events:none}
.auth-card{background:var(--bg-elev);border-radius:var(--radius-lg);padding:36px;max-width:430px;width:100%;box-shadow:var(--shadow-lg);animation:slideUp .4s ease;position:relative;z-index:1}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .brand-logo{margin:0 auto 14px;display:block}
.auth-logo h1{font-size:26px;margin-bottom:6px;letter-spacing:-.03em;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.auth-subtitle{color:var(--text-muted);font-size:13px;font-weight:500}
.auth-slogan{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:5px 14px;background:linear-gradient(135deg,rgba(14,165,233,.12),rgba(168,85,247,.12));color:var(--primary);font-size:11px;font-weight:700;border-radius:20px}
.auth-slogan svg{color:#FACC15}
.auth-tabs{display:flex;background:var(--bg);border-radius:var(--radius);padding:4px;margin-bottom:20px}
.auth-tab{flex:1;padding:9px;border:none;background:transparent;color:var(--text-muted);font-weight:600;border-radius:9px;cursor:pointer;transition:var(--transition);font-size:13px}
.auth-tab.active{background:var(--bg-elev);color:var(--text);box-shadow:var(--shadow)}
.auth-form{display:none}.auth-form.active{display:block;animation:fadeIn .3s ease}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;font-size:14px;font-family:inherit;transition:var(--transition)}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);background:var(--bg-elev);box-shadow:0 0 0 4px rgba(14,165,233,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border:1px solid transparent;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:var(--transition);white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--primary),#38BDF8);color:#fff;box-shadow:0 4px 12px rgba(14,165,233,.28)}
.btn-primary:hover{background:linear-gradient(135deg,var(--primary-hover),var(--primary));transform:translateY(-1px)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--border)}
.btn-ghost:hover{background:var(--bg);border-color:var(--primary);color:var(--primary)}
.btn-success{background:var(--success);color:#fff}
.btn-warn{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn-warn:hover{background:var(--danger);color:#fff}
.btn-block{width:100%}.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;gap:5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.auth-link{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted);font-weight:500}
.auth-message{margin-top:16px;padding:11px 14px;border-radius:10px;font-size:13px;display:none}
.auth-message.error{display:block;background:rgba(239,68,68,.1);color:var(--danger)}
.auth-message.success{display:block;background:rgba(16,185,129,.1);color:var(--success)}
#app-screen{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--bg-elev);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform var(--transition)}
.sidebar-header{padding:20px 18px;border-bottom:1px solid var(--border)}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;color:var(--text-muted);cursor:pointer;font-size:14px;font-weight:500;margin-bottom:2px;transition:var(--transition);position:relative}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,rgba(14,165,233,.12),rgba(168,85,247,.08));color:var(--primary);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--primary);border-radius:0 3px 3px 0}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.sidebar-footer-row{display:flex;gap:8px;width:100%}.sidebar-footer-row .btn{flex:1}
.tg-link{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 12px;border-radius:10px;background:linear-gradient(135deg,#0088cc,#00a3e0);color:#fff!important;font-size:13px;font-weight:600;text-decoration:none}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 22px;background:var(--bg-elev);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.topbar h1{font-size:18px;flex:1;font-weight:700}
.user-info{display:flex;align-items:center;gap:10px;font-size:13px}
.badge{padding:4px 10px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase}
.content{padding:18px;flex:1}
.only-mobile{display:none}
@media (max-width:768px){.only-mobile{display:inline-flex}.sidebar{position:fixed;z-index:100;height:100%;transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.content{padding:12px}}
.card{background:var(--bg-elev);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--border)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:700}
.grid{display:grid;gap:14px}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.stat-card{background:var(--bg-elev);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:var(--transition);border:1px solid var(--border);position:relative;overflow:hidden}
.stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;font-weight:700}
.stat-value{font-size:26px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--bg-elev);border-radius:var(--radius);overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--bg);font-weight:700;font-size:11px;text-transform:uppercase;color:var(--text-muted)}
.empty{padding:38px;text-align:center;color:var(--text-muted)}
.grade{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 8px;border-radius:8px;font-weight:800;color:#fff}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--bg-elev);border-radius:var(--radius-lg);padding:22px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-wide{max-width:680px}
.modal-title{font-size:17px;margin-bottom:16px;font-weight:800;display:flex;align-items:center;gap:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.toast-root{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:var(--bg-elev);color:var(--text);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:13px;border-left:4px solid var(--primary);font-weight:500;display:flex;gap:10px;pointer-events:auto;max-width:340px}
.toast.success{border-left-color:var(--success)}.toast.error{border-left-color:var(--danger)}.toast.warning{border-left-color:var(--warning)}
.invite-code{display:inline-flex;font-family:monospace;background:var(--bg);padding:7px 12px;border-radius:8px;font-weight:800;font-size:15px;letter-spacing:.12em;color:var(--primary);border:1.5px dashed rgba(14,165,233,.3)}
.loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:999}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:12px;color:var(--text-muted);margin-top:6px;line-height:1.5}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.dash-anim{animation:fadeInUp .55s cubic-bezier(.16,1,.3,1) both}
.dash-greet{background:linear-gradient(135deg,#0EA5E9,#A855F7);color:#fff;border-radius:var(--radius-lg);padding:26px 28px;margin-bottom:18px;position:relative;overflow:hidden}
.dash-greet h2{font-size:24px;font-weight:800;margin-bottom:6px}
.dash-greet p{font-size:14px;opacity:.92}
.tg-banner{display:flex;align-items:center;gap:16px;padding:18px 22px;background:linear-gradient(135deg,#0088cc,#00a3e0);border-radius:var(--radius);color:#fff;text-decoration:none;margin-bottom:16px}
.journal-shell{display:flex;flex-direction:column;height:calc(100vh - 100px);background:var(--bg-elev);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
@media (max-width:768px){.journal-shell{height:calc(100vh - 110px)}}
.journal-top{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;padding:8px 12px;border-bottom:1px solid var(--border)}
.journal-top .filter{display:flex;flex-direction:column;gap:2px;min-width:100px}
.journal-top .filter label{font-size:9px;text-transform:uppercase;color:var(--text-muted);font-weight:700}
.journal-top select,.journal-top .btn{padding:5px 10px;font-size:11px}
.journal-sub{padding:5px 12px;background:var(--bg);border-bottom:1px solid var(--border);font-size:10px;color:var(--text-muted);display:flex;gap:10px;flex-wrap:wrap}
.journal-scroll{flex:1;overflow:auto}
.j-table{border-collapse:separate;border-spacing:0;font-size:var(--j-font);width:max-content;min-width:100%}
.j-table th,.j-table td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:0;text-align:center;background:var(--bg-elev);white-space:nowrap;height:var(--j-row)}
.j-table thead th{background:var(--bg);font-weight:700;font-size:var(--j-head-font);color:var(--text-muted);position:sticky;z-index:2;padding:0 2px}
.j-table thead tr:nth-child(1) th{top:0;height:20px}
.j-table thead tr:nth-child(2) th{top:20px;height:var(--j-row)}
.j-table thead tr:nth-child(3) th{top:calc(20px + var(--j-row));height:16px;font-size:calc(var(--j-font) - 1px)}
.j-table .col-num{position:sticky;left:0;z-index:5;width:var(--j-num-w);min-width:var(--j-num-w);background:var(--bg-elev);font-weight:600;color:var(--text-muted);font-size:calc(var(--j-font) - 1px)}
.j-table .col-name{position:sticky;left:var(--j-num-w);z-index:5;width:var(--j-name-w);min-width:var(--j-name-w);max-width:var(--j-name-w);text-align:left;padding:0 6px;font-size:var(--j-font);background:var(--bg-elev);overflow:hidden;text-overflow:ellipsis;box-shadow:3px 0 6px -3px rgba(15,23,42,.15)}
.j-table thead .col-num,.j-table thead .col-name{z-index:7;background:var(--bg)}
.j-table .col-avg,.j-table .col-final{position:sticky!important;background:var(--bg-elev)!important}
.j-table .col-avg{right:var(--j-avg-w);z-index:5;width:var(--j-avg-w);min-width:var(--j-avg-w);font-weight:800;font-size:var(--j-font);border-left:2px solid var(--border)!important}
.j-table .col-final{right:0;z-index:5;width:var(--j-avg-w);min-width:var(--j-avg-w);font-weight:800;font-size:var(--j-font);box-shadow:-3px 0 8px -3px rgba(15,23,42,.15)}
.j-table thead .col-avg,.j-table thead .col-final{z-index:7;background:var(--bg)!important}
.j-table td.date-cell{padding:0!important;position:relative;width:var(--j-cell);min-width:var(--j-cell);max-width:var(--j-cell);height:var(--j-row);max-height:var(--j-row);overflow:hidden}
.j-cell{position:absolute;top:1px;left:1px;right:1px;bottom:1px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-weight:800;color:#fff;font-size:var(--j-font);cursor:pointer;overflow:hidden;max-height:calc(var(--j-row) - 2px)}
.j-cell.empty{background:transparent;border:1px dashed rgba(148,163,184,.4)}
.j-cell.empty::after{content:'+';color:var(--text-muted);opacity:0}
.j-cell.empty:hover{border-color:var(--primary);background:rgba(14,165,233,.1)}
.j-cell.empty:hover::after{opacity:1;color:var(--primary)}
.g5{background:#10B981}.g4{background:#84CC16}.g3{background:#F59E0B}.g2{background:#EF4444}.g1{background:#991B1B}
.j-att-badge{position:absolute;top:0;right:0;width:9px;height:9px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;color:#fff;border:1px solid var(--bg-elev);z-index:3}
.j-att-badge.n{background:#EF4444}.j-att-badge.u{background:#F59E0B}.j-att-badge.o{background:#64748B}
.j-table .date-h{cursor:pointer;padding:0 1px;min-width:var(--j-cell)}
.j-table .date-h:hover{background:rgba(14,165,233,.15);color:var(--primary)}
.j-table .date-h.weekend{color:#EF4444}
.j-table .date-h.today{background:linear-gradient(135deg,rgba(14,165,233,.18),rgba(168,85,247,.12));color:var(--primary);font-weight:800}
.j-table .month-h{background:linear-gradient(180deg,var(--bg),rgba(14,165,233,.06))!important;font-weight:800;color:var(--text)!important;font-size:var(--j-head-font)!important;padding:0 2px}
.g-avg-5{color:#10B981}.g-avg-4{color:#65A30D}.g-avg-3{color:#D97706}.g-avg-2{color:#DC2626}.g-avg-1{color:#991B1B}
.grade-picker,.att-picker{display:flex;gap:8px;flex-wrap:wrap}
.grade-btn,.att-btn{width:44px;height:44px;border-radius:10px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.grade-btn.active.gb-5{background:#10B981;color:#fff;border-color:transparent}
.grade-btn.active.gb-4{background:#84CC16;color:#fff;border-color:transparent}
.grade-btn.active.gb-3{background:#F59E0B;color:#fff;border-color:transparent}
.grade-btn.active.gb-2{background:#EF4444;color:#fff;border-color:transparent}
.grade-btn.active.gb-1{background:#991B1B;color:#fff;border-color:transparent}
.att-btn.active.ab-n{background:#EF4444;color:#fff;border-color:transparent}
.att-btn.active.ab-u{background:#F59E0B;color:#fff;border-color:transparent}
.att-btn.active.ab-o{background:#64748B;color:#fff;border-color:transparent}
.att-btn.active.ab-ok{background:#10B981;color:#fff;border-color:transparent}
.subjects-toolbar{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.subjects-toolbar input{flex:1;min-width:140px}
.subjects-box{max-height:300px;overflow-y:auto;border:1.5px solid var(--border);border-radius:10px;padding:10px;background:var(--bg)}
.subject-group{margin-bottom:12px}
.subject-group-title{font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-bottom:5px}
.subject-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px}
.subject-item.checked{background:linear-gradient(135deg,rgba(14,165,233,.12),rgba(168,85,247,.08));color:var(--primary);font-weight:600}
.subject-item input{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
.weekday-picker{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.weekday-picker label{padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600}
.weekday-picker label input{display:none}
.weekday-picker label.on{background:linear-gradient(135deg,var(--primary),#38BDF8);color:#fff;border-color:transparent}
.lesson-tip{position:fixed;z-index:1000;background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;padding:8px 10px;box-shadow:var(--shadow-lg);max-width:240px;font-size:11px;line-height:1.4;pointer-events:none}
.lesson-tip .tip-title{font-size:9px;text-transform:uppercase;color:var(--text-muted);font-weight:700;letter-spacing:.05em;margin-bottom:2px}
.lesson-tip .tip-body{color:var(--text);margin-bottom:6px}
.mini-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.mini-row:last-child{border-bottom:none}
.mini-row .mr-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;font-size:13px}
.mini-row .mr-body{flex:1;min-width:0}
.mini-row .mr-title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-row .mr-sub{font-size:11px;color:var(--text-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-row .mr-time{font-size:11px;color:var(--text-muted);white-space:nowrap;flex-shrink:0}
.subject-bar{margin-bottom:12px}
.subject-bar:last-child{margin-bottom:0}
.subject-bar-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:5px}
.subject-bar-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}

  var st = Object.entries(App.cache.students).filter(function(e) { return e[1].classId === classId; }).sort(function(a, b) { return a[1].name.localeCompare(b[1].name); });
  var g = Object.entries(App.cache.grades).filter(function(e) { return e[1].classId === classId && e[1].subject === subject; }).map(function(e) { return Object.assign({}, e[1], { id:e[0], dms:new Date(e[1].date).setHours(0,0,0,0) }); }).filter(function(x) { return inQuarter(x.dms, quarterId); });
  var dateSet = {}; g.forEach(function(x) { dateSet[x.dms] = true; });
  var ds = Object.keys(dateSet).map(Number).sort(function(a, b) { return a - b; });
  var csv = 'Журнал ' + cls.name + ' / ' + subject + '\n';
  csv += '№;Ученик;' + ds.map(function(d) { return new Date(d).toLocaleDateString('ru-RU'); }).join(';') + ';Средний\n';
  st.forEach(function(entry, i) {
    var sid = entry[0], s = entry[1];
    var row = [i + 1, s.name];
    ds.forEach(function(d) { var x = g.find(function(y) { return y.studentId === sid && y.dms === d; }); row.push(x ? x.value : ''); });
    var sg = g.filter(function(x) { return x.studentId === sid; });
    row.push(weightedAvg(sg) || '');
    csv += row.join(';') + '\n';
  });
  var b = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8' });
  var u = URL.createObjectURL(b);
  var a = document.createElement('a');
  a.href = u;
  a.download = 'journal_' + cls.name + '_' + subject + '.csv';
  a.click(); URL.revokeObjectURL(u);
}
function importCSVDialog(classId) {
  var input = document.createElement('input');
  input.type = 'file'; input.accept = '.csv,.txt,text/csv,text/plain';
  input.onchange = function(e) {
    var file = e.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = async function(ev) {
      try {
        var text = (ev.target.result || '').replace(/^\uFEFF/, '');
        var lines = text.split(/\r?\n/); var names = [];
        lines.forEach(function(line) {
          var s = (line || '').trim(); if (!s) return;
          var parts = s.split(/[;\t]|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(function(p) { return p.trim().replace(/^"+|"+$/g, '').trim(); }).filter(Boolean);
          if (!parts.length) return;
          if (/^(№|no|number|фио|имя|ученик|ученики|fio|name)$/i.test(parts[0])) return;
          var name = parts.reduce(function(a, b) { return b.length > a.length ? b : a; }, '');
          if (name && name.length >= 3 && /[А-Яа-яЁёA-Za-z]/.test(name)) names.push(name);
        });
        var seen = {};
        names = names.filter(function(n) { var key = n.toLowerCase(); if (seen[key]) return false; seen[key] = true; return true; });
        if (!names.length) return toast('Не удалось найти имена', 'error');
        var ok = await warnDialog('Импорт учеников', 'Найдено: <b>' + names.length + '</b><br><br>Добавить?', 'Добавить ' + names.length);
        if (!ok) return;
        var u = {}; var now = Date.now();
        names.forEach(function(n, i) { var id = db.ref('students').push().key; u['students/' + id] = { name:n, classId:classId, createdAt:now + i }; });
        await db.ref().update(u);
        toast('Импортировано: <b>' + names.length + '</b>', 'success');
        await loadAll();
        if (location.hash.indexOf('#class/') === 0) renderClassDetail(classId); else router();
      } catch (err) { toast('Ошибка чтения файла: ' + err.message, 'error'); }
    };
    reader.readAsText(file, 'UTF-8');
  };
  input.click();
}

  $('#user-role').textContent = roleLabel(profile.role);
  try {
    await loadAll();
    if (Object.keys(App.cache.workTypes).length === 0 && profile.role === 'super_admin') {
      try { await bootstrapDefaultWorkTypes(); } catch(e) { console.warn(e); }
    }
    buildMenu();
    showApp();
    if (!location.hash) location.hash = '#dashboard';
    router();
  } catch (err) { console.error(err); toast('Ошибка: ' + err.message, 'error'); showApp(); }
}
async function bootstrapDefaultWorkTypes() {
  var u = {};
  DEFAULT_WORK_TYPES.forEach(function(wt) { var id = db.ref('workTypes').push().key; u['workTypes/' + id] = { name:wt.name, weight:wt.weight, code:wt.code, createdBy:App.profile.uid, createdAt:Date.now() }; });
  await db.ref().update(u);
  await loadAll();
}
$('#logout-btn').onclick = async function() {
  API.logout();
  clearSession();
  location.reload();
};
$('#menu-toggle').onclick = function() { $('#sidebar').classList.toggle('open'); };

(async function() {
  showLoader('Проверка сессии…');
  var session = getSession();
  if (!session) { showAuth(); return; }
  if (!API.idToken) { showAuth(); return; }
  try {
    var me = await API.request('/api/me');
    startApp(me.profile);
  } catch (err) {
    API.logout(); clearSession(); showAuth();
  }
})();
</script>
</body>
</html>
