<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Электронный журнал</title>
<style>
:root{
  --bg:#f5f7fa; --bg-elev:#fff; --text:#1a202c; --text-muted:#64748b;
  --border:#e2e8f0; --primary:#4f46e5; --primary-hover:#4338ca;
  --danger:#ef4444; --success:#10b981; --warning:#f59e0b;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 25px rgba(0,0,0,.1);
  --radius:10px; --transition:.2s ease;
}
[data-theme="dark"]{
  --bg:#0f172a; --bg-elev:#1e293b; --text:#e2e8f0; --text-muted:#94a3b8;
  --border:#334155; --primary:#6366f1; --primary-hover:#818cf8;
  --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 10px 25px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;
  transition:background var(--transition),color var(--transition);
}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit}

#auth-screen{
  display:flex;align-items:center;justify-content:center;min-height:100vh;
  padding:20px;background:linear-gradient(135deg,#667eea,#764ba2);
}
.auth-card{
  background:var(--bg-elev);border-radius:16px;padding:32px;max-width:420px;
  width:100%;box-shadow:var(--shadow-lg);animation:slideUp .4s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo h1{font-size:22px;margin-bottom:6px}
.auth-subtitle{color:var(--text-muted);font-size:13px}
.auth-tabs{display:flex;background:var(--bg);border-radius:var(--radius);padding:4px;margin-bottom:20px}
.auth-tab{flex:1;padding:9px;border:none;background:transparent;color:var(--text-muted);
  font-weight:500;border-radius:8px;cursor:pointer;transition:var(--transition)}
.auth-tab.active{background:var(--bg-elev);color:var(--text);box-shadow:var(--shadow)}
.auth-form{display:none}
.auth-form.active{display:block;animation:fadeIn .3s ease}

.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);
  margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
input,select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);background:var(--bg);
  color:var(--text);border-radius:8px;font-size:14px;font-family:inherit;transition:var(--transition);
}
textarea{resize:vertical;min-height:100px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(99,102,241,.15)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 16px;border:1px solid transparent;border-radius:8px;font-size:14px;
  font-weight:500;cursor:pointer;transition:var(--transition);white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg)}
.btn-block{width:100%}
.btn-sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.auth-link{display:block;text-align:center;margin-top:14px;font-size:13px;color:var(--text-muted)}
.auth-message{margin-top:16px;padding:10px;border-radius:8px;font-size:13px;display:none}
.auth-message.error{display:block;background:rgba(239,68,68,.1);color:var(--danger)}
.auth-message.success{display:block;background:rgba(16,185,129,.1);color:var(--success)}
.auth-message.info{display:block;background:rgba(99,102,241,.1);color:var(--primary)}

#app-screen{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--bg-elev);border-right:1px solid var(--border);
  display:flex;flex-direction:column;transition:transform var(--transition)}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border)}
.sidebar-header h2{font-size:18px}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
  color:var(--text-muted);cursor:pointer;font-size:14px;margin-bottom:2px;transition:var(--transition)}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--primary);color:#fff}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
.sidebar-footer .btn{flex:1}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:16px;padding:16px 24px;
  background:var(--bg-elev);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.topbar h1{font-size:20px;flex:1}
.user-info{display:flex;align-items:center;gap:10px;font-size:13px}
.badge{padding:4px 10px;background:var(--primary);color:#fff;border-radius:20px;
  font-size:11px;font-weight:600;text-transform:uppercase}
.content{padding:24px;flex:1}
.only-mobile{display:none}
@media (max-width:768px){
  .only-mobile{display:inline-flex}
  .sidebar{position:fixed;z-index:100;height:100%;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  .content{padding:16px}
}

.card{background:var(--bg-elev);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;gap:12px;flex-wrap:wrap}
.card-title{font-size:16px;font-weight:600}

.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.stat-card{background:var(--bg-elev);border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow);transition:var(--transition)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:8px}
.stat-value{font-size:26px;font-weight:700}

table{width:100%;border-collapse:collapse;font-size:13px;background:var(--bg-elev);
  border-radius:var(--radius);overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--bg);font-weight:600;font-size:12px;text-transform:uppercase;
  color:var(--text-muted);letter-spacing:.03em}
tbody tr{transition:var(--transition)}
tbody tr:hover{background:var(--bg)}
tbody tr:last-child td{border-bottom:none}

.empty{padding:40px;text-align:center;color:var(--text-muted)}
.empty-icon{font-size:40px;display:block;margin-bottom:8px;opacity:.5}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input,.toolbar select{width:auto;min-width:160px}

.grade{display:inline-flex;align-items:center;justify-content:center;min-width:30px;
  height:30px;padding:0 8px;border-radius:8px;font-weight:700;color:#fff;
  cursor:pointer;transition:var(--transition)}
.grade:hover{transform:scale(1.08)}
.grade-5{background:#10b981}
.grade-4{background:#84cc16}
.grade-3{background:#f59e0b}
.grade-2{background:#ef4444}
.grade-avg{background:var(--primary)}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;
  align-items:center;justify-content:center;z-index:200;padding:20px;animation:fadeIn .2s ease}
.modal{background:var(--bg-elev);border-radius:14px;padding:24px;max-width:500px;width:100%;
  max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .25s ease}
.modal-title{font-size:18px;margin-bottom:16px;font-weight:600}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

.toast-root{position:fixed;top:20px;right:20px;z-index:300;display:flex;
  flex-direction:column;gap:10px;pointer-events:none}
.toast{background:var(--bg-elev);color:var(--text);padding:12px 18px;border-radius:10px;
  box-shadow:var(--shadow-lg);border-left:4px solid var(--primary);font-size:13px;
  animation:slideIn .3s ease;pointer-events:auto;max-width:340px}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

.invite-code{display:inline-flex;align-items:center;gap:8px;font-family:"Courier New",monospace;
  background:var(--bg);padding:8px 14px;border-radius:8px;font-weight:700;
  font-size:16px;letter-spacing:.1em}
.invite-code.used{opacity:.5;text-decoration:line-through}

.loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;z-index:999}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.hint{font-size:12px;color:var(--text-muted);margin-top:6px;line-height:1.5}
</style>
</head>
<body>

<div id="loader-screen" class="loader">
  <div class="spinner"></div>
  <div id="loader-text" style="color:var(--text-muted);font-size:13px;">Загрузка…</div>
</div>

<div id="auth-screen" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>📚 Электронный журнал</h1>
      <p class="auth-subtitle">Войдите или зарегистрируйтесь</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Вход</button>
      <button class="auth-tab" data-tab="register">Регистрация</button>
    </div>

    <form id="login-form" class="auth-form active">
      <div class="form-group">
        <label>Логин или Email</label>
        <input type="text" id="login-input" required placeholder="admin">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="login-password" required placeholder="••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Войти</button>
      <a href="#" id="forgot-password" class="auth-link">Забыли пароль?</a>
    </form>

    <form id="register-form" class="auth-form">
      <div class="form-group">
        <label>Код приглашения</label>
        <input type="text" id="invite-code" required placeholder="ABC123">
      </div>
      <div class="form-group">
        <label>ФИО</label>
        <input type="text" id="reg-name" required placeholder="Иванов Иван Иванович">
      </div>
      <div class="form-group">
        <label>Логин</label>
        <input type="text" id="reg-login" required placeholder="ivanov">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" required placeholder="ivanov@mail.ru">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="reg-password" required minlength="6" placeholder="минимум 6 символов">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
    </form>

    <div id="auth-message" class="auth-message"></div>
  </div>
</div>

<div id="app-screen" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><h2>📚 ЭЖ</h2></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button id="theme-toggle" class="btn btn-ghost" title="Сменить тему">🌙</button>
      <button id="logout-btn" class="btn btn-ghost">Выйти</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button id="menu-toggle" class="btn btn-ghost only-mobile">☰</button>
      <h1 id="page-title">Дашборд</h1>
      <div class="user-info">
        <span id="user-name"></span>
        <span class="badge" id="user-role"></span>
      </div>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
/* ============================================================
   КОНФИГУРАЦИЯ FIREBASE
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBSb532Ppi7xXdfHcuDfXTp6U_ut_0saio",
  authDomain: "zing-30a21.firebaseapp.com",
  databaseURL: "https://zing-30a21-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "zing-30a21",
  storageBucket: "zing-30a21.firebasestorage.app",
  messagingSenderId: "179467663659",
  appId: "1:179467663659:web:be71167fd0ffd412416d6e"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.database();

const secondaryApp  = firebase.initializeApp(firebaseConfig, 'Secondary');
const secondaryAuth = secondaryApp.auth();

/* ============================================================
   ЗАХАРДКОЖЕННЫЙ АДМИН
============================================================ */
const HARDCODED_ADMIN = {
  login:    'admin',
  password: 'admin',
  profile: {
    role: 'super_admin',
    login: 'admin',
    name: 'Главный администратор',
    email: 'admin@local'
  }
};

/* ============================================================
   СЕССИЯ
============================================================ */
const SESSION_KEY = 'ej_session_v1';

function getSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function setSession(user, profile) {
  localStorage.setItem(SESSION_KEY, JSON.stringify({ user, profile }));
}
function clearSession() {
  localStorage.removeItem(SESSION_KEY);
}

/* ============================================================
   УТИЛИТЫ
============================================================ */
const $  = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const el = (tag, props = {}, ...children) => {
  const n = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v);
  });
  children.flat().forEach(c => n.append(c?.nodeType ? c : document.createTextNode(c ?? '')));
  return n;
};

function toast(msg, type = 'info') {
  const t = el('div', { class: `toast ${type}`, html: msg });
  $('#toast-root').appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

function showModal(title, bodyHtml, actions = []) {
  const root = $('#modal-root');
  root.innerHTML = '';
  const backdrop = el('div', { class: 'modal-backdrop' });
  backdrop.innerHTML = `
    <div class="modal">
      <h3 class="modal-title">${title}</h3>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-actions"></div>
    </div>`;
  const actionsEl = backdrop.querySelector('.modal-actions');
  actions.forEach(a => {
    const b = el('button', {
      class: `btn ${a.class || 'btn-ghost'}`,
      onclick: () => a.onClick ? a.onClick(backdrop) : closeModal()
    }, a.label);
    actionsEl.appendChild(b);
  });
  backdrop.onclick = (e) => { if (e.target === backdrop) closeModal(); };
  root.appendChild(backdrop);
  return backdrop;
}
function closeModal() { $('#modal-root').innerHTML = ''; }

function confirmDialog(title, message) {
  return new Promise(res => {
    showModal(title, `<p>${message}</p>`, [
      { label: 'Отмена', onClick: () => { closeModal(); res(false); } },
      { label: 'Подтвердить', class: 'btn-danger', onClick: () => { closeModal(); res(true); } }
    ]);
  });
}

const fmt = {
  date: (ts) => ts ? new Date(ts).toLocaleDateString('ru-RU') : '—',
  dt:   (ts) => ts ? new Date(ts).toLocaleString('ru-RU') : '—'
};

function gradeClass(v) {
  const n = Math.round(v);
  if (n >= 5) return 'grade-5';
  if (n === 4) return 'grade-4';
  if (n === 3) return 'grade-3';
  return 'grade-2';
}
function avgClass(v) {
  if (v >= 4.5) return 'grade-5';
  if (v >= 3.5) return 'grade-4';
  if (v >= 2.5) return 'grade-3';
  return 'grade-2';
}

function translateError(err) {
  const map = {
    'auth/user-not-found':       'Пользователь не найден',
    'auth/wrong-password':       'Неверный пароль',
    'auth/invalid-email':        'Неверный email',
    'auth/invalid-credential':   'Неверный логин или пароль',
    'auth/email-already-in-use': 'Email уже используется',
    'auth/weak-password':        'Слишком простой пароль (мин. 6 символов)',
    'auth/too-many-requests':    'Слишком много попыток. Попробуйте позже.',
    'auth/network-request-failed': 'Проблема с сетью',
    'auth/operation-not-allowed':  'Email/Password не включён в Firebase Console'
  };
  return map[err.code] || err.message || 'Неизвестная ошибка';
}

/* ============================================================
   ТЕМА
============================================================ */
function initTheme() {
  const t = localStorage.getItem('theme') || 'light';
  document.documentElement.dataset.theme = t;
  const btn = $('#theme-toggle');
  if (btn) {
    btn.textContent = t === 'dark' ? '☀️' : '🌙';
    btn.onclick = () => {
      const cur = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = cur;
      localStorage.setItem('theme', cur);
      btn.textContent = cur === 'dark' ? '☀️' : '🌙';
    };
  }
}
initTheme();

/* ============================================================
   АВТОРИЗАЦИЯ: вкладки
============================================================ */
function showAuthMsg(text, type = 'error') {
  const el2 = $('#auth-message');
  el2.textContent = text;
  el2.className = 'auth-message ' + type;
  setTimeout(() => { el2.className = 'auth-message'; }, 6000);
}

$$('.auth-tab').forEach(tab => {
  tab.onclick = () => {
    $$('.auth-tab').forEach(t => t.classList.remove('active'));
    $$('.auth-form').forEach(f => f.classList.remove('active'));
    tab.classList.add('active');
    $(`#${tab.dataset.tab}-form`).classList.add('active');
  };
});

/* ============================================================
   ВХОД
============================================================ */
$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const loginInput = $('#login-input').value.trim();
  const password   = $('#login-password').value;
  if (!loginInput || !password) return;

  if (loginInput === HARDCODED_ADMIN.login && password === HARDCODED_ADMIN.password) {
    const user = { uid: 'admin-local', email: HARDCODED_ADMIN.profile.email };
    const profile = { ...HARDCODED_ADMIN.profile, createdAt: Date.now() };
    setSession(user, profile);
    startApp(user, profile);
    return;
  }

  try {
    let email = loginInput;
    if (!loginInput.includes('@')) {
      const snap = await db.ref('users').orderByChild('login').equalTo(loginInput).once('value');
      if (!snap.exists()) return showAuthMsg('Пользователь с таким логином не найден');
      const u = Object.values(snap.val())[0];
      email = u.email;
    }
    await auth.signInWithEmailAndPassword(email, password);
  } catch (err) {
    showAuthMsg(translateError(err));
  }
});

/* ============================================================
   РЕГИСТРАЦИЯ ПО КОДУ
============================================================ */
$('#register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code     = $('#invite-code').value.trim().toUpperCase();
  const name     = $('#reg-name').value.trim();
  const login    = $('#reg-login').value.trim();
  const email    = $('#reg-email').value.trim();
  const password = $('#reg-password').value;

  try {
    const inviteSnap = await db.ref('invites/' + code).once('value');
    if (!inviteSnap.exists()) return showAuthMsg('Неверный код приглашения');
    const invite = inviteSnap.val();
    if (invite.used) return showAuthMsg('Код уже использован');
    if (invite.expiresAt && invite.expiresAt < Date.now()) return showAuthMsg('Код истёк');

    const loginCheck = await db.ref('users').orderByChild('login').equalTo(login).once('value');
    if (loginCheck.exists()) return showAuthMsg('Такой логин уже занят');

    const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    await secondaryAuth.signOut();

    await db.ref('users/' + uid).set({
      role: invite.role || 'teacher',
      login, name, email,
      schoolId: invite.schoolId || null,
      cityId: invite.cityId || null,
      createdAt: Date.now()
    });

    await db.ref('invites/' + code).update({
      used: true, usedBy: uid, usedAt: Date.now()
    });

    showAuthMsg('Регистрация успешна! Входим…', 'success');
    setTimeout(async () => {
      await auth.signInWithEmailAndPassword(email, password);
    }, 800);
  } catch (err) {
    showAuthMsg(translateError(err));
  }
});

$('#forgot-password').onclick = async (e) => {
  e.preventDefault();
  const val = prompt('Введите ваш email для сброса пароля:');
  if (!val) return;
  try {
    await auth.sendPasswordResetEmail(val.trim());
    showAuthMsg('Письмо отправлено. Проверьте почту.', 'success');
  } catch (err) {

function buildMenu() {
  const nav = $('#sidebar-nav');
  nav.innerHTML = '';
  const items = MENU[App.profile.role] || [];
  items.forEach(it => {
    const a = el('div', {
      class: 'nav-item' + (location.hash === '#' + it.id ? ' active' : ''),
      onclick: () => navigate(it.id)
    }, it.label);
    nav.appendChild(a);
  });
}

function navigate(view, params = {}) {
  location.hash = '#' + view + (params.id ? '/' + params.id : '');
  router();
}

/* ★ ИСПРАВЛЕНО: разрешаем скрытые виды (class), которых нет в меню */
async function router() {
  const hash = location.hash.slice(1) || 'dashboard';
  const [view, id] = hash.split('/');

  if (!App.profile) return;

  const items = MENU[App.profile.role] || [];
  const allowed = items.map(i => i.id);

  // Скрытые виды (не показываются в меню, но доступны по прямой ссылке)
  const HIDDEN_VIEWS = ['class'];
  HIDDEN_VIEWS.forEach(v => { if (!allowed.includes(v)) allowed.push(v); });

  if (!allowed.includes(view)) return navigate('dashboard');

  $$('.nav-item').forEach(n => n.classList.remove('active'));
  const idx = items.findIndex(i => i.id === view);
  if (idx >= 0) $$('.nav-item')[idx]?.classList.add('active');

  const renderers = {
    dashboard: renderDashboard,
    cities:    renderCities,
    schools:   renderSchools,
    users:     renderUsers,
    invites:   renderInvites,
    classes:   renderClasses,
    class:     () => renderClassDetail(id),
    journal:   renderJournal,
    students:  renderStudents,
    worktypes: renderWorkTypes,
    profile:   renderProfile
  };
  const fn = renderers[view];
  if (fn) await fn();
  $('#sidebar').classList.remove('open');
}

window.addEventListener('hashchange', router);

async function loadAll() {
  const [cities, schools, classes, students, grades, workTypes, invites, users] =
    await Promise.all([
      db.ref('cities').once('value'),
      db.ref('schools').once('value'),
      db.ref('classes').once('value'),
      db.ref('students').once('value'),
      db.ref('grades').once('value'),
      db.ref('workTypes').once('value'),
      db.ref('invites').once('value'),
      db.ref('users').once('value')
    ]);
  App.cache.cities    = cities.val()    || {};
  App.cache.schools   = schools.val()   || {};
  App.cache.classes   = classes.val()   || {};
  App.cache.students  = students.val()  || {};
  App.cache.grades    = grades.val()    || {};
  App.cache.workTypes = workTypes.val() || {};
  App.cache.invites   = invites.val()   || {};
  App.cache.users     = users.val()     || {};
}

function mySchools() {
  const s = App.cache.schools;
  if (App.profile.role === 'super_admin') return s;
  if (App.profile.role === 'city_creator')
    return Object.fromEntries(Object.entries(s).filter(([,v]) => v.cityId === App.profile.cityId));
  if (App.profile.role === 'school_creator' || App.profile.role === 'teacher')
    return Object.fromEntries(Object.entries(s).filter(([k]) => k === App.profile.schoolId));
  return {};
}
function myClasses() {
  return Object.fromEntries(
    Object.entries(App.cache.classes).filter(([,c]) => c.teacherId === App.user.uid)
  );
}

async function renderJournal() {
  $('#page-title').textContent = 'Журнал оценок';
  const c = $('#content');
  c.innerHTML = '';
  const classes = myClasses();
  if (!Object.keys(classes).length) {
    c.appendChild(el('div', { class: 'card empty' }, 'Сначала создайте класс'));
    return;
  }
  const card = el('div', { class: 'card' });
  const toolbar = el('div', { class: 'toolbar' });

  const classSel = el('select');
  classSel.innerHTML = '<option value="">— Все классы —</option>';
  Object.entries(classes).forEach(([id, cl]) =>
    classSel.appendChild(el('option', { value: id }, cl.name)));

  const subjectSel = el('select');
  subjectSel.innerHTML = '<option value="">— Все предметы —</option>';

  const searchInput = el('input', { placeholder: '🔍 Поиск ученика', type: 'text' });

  const updateSubjects = () => {
    const cid = classSel.value;
    subjectSel.innerHTML = '<option value="">— Все предметы —</option>';
    if (cid && classes[cid].subjects) {
      classes[cid].subjects.forEach(s => subjectSel.appendChild(el('option', { value: s }, s)));
    }
  };
  classSel.onchange = () => { updateSubjects(); drawGrades(); };
  subjectSel.onchange = drawGrades;
  searchInput.oninput = drawGrades;

  toolbar.append(classSel, subjectSel, searchInput);
  card.appendChild(el('div', { class: 'card-header' },
    el('div', { class: 'card-title' }, 'Оценки'),
    el('button', { class: 'btn btn-primary btn-sm', onclick: () => addGradeDialog(classSel.value) }, '+ Выставить оценку')
  ));
  card.appendChild(toolbar);

  const tableWrap = el('div');
  card.appendChild(tableWrap);
  c.appendChild(card);

  function drawGrades() {
    tableWrap.innerHTML = '';
    const cid = classSel.value;
    const subj = subjectSel.value;
    const q = searchInput.value.toLowerCase().trim();

    let grades = Object.entries(App.cache.grades).filter(([,g]) => g.teacherId === App.user.uid);
    if (cid) grades = grades.filter(([,g]) => g.classId === cid);
    if (subj) grades = grades.filter(([,g]) => g.subject === subj);

    const byStudent = {};
    grades.forEach(([gid, g]) => {
      const s = App.cache.students[g.studentId];
      if (!s) return;
      if (q && !s.name.toLowerCase().includes(q)) return;
      (byStudent[g.studentId] ||= []).push({ gid, ...g });
    });

    if (!Object.keys(byStudent).length) {
      tableWrap.appendChild(el('div', { class: 'empty' }, 'Оценок не найдено'));
      return;
    }

    const t = el('table');
    t.innerHTML = `<thead><tr><th>Ученик</th><th>Оценки</th><th>Средний</th></tr></thead>`;
    const tb = el('tbody');
    Object.entries(byStudent)
      .sort((a,b) => App.cache.students[a[0]].name.localeCompare(App.cache.students[b[0]].name))
      .forEach(([sid, list]) => {
        list.sort((a,b) => (a.date||0) - (b.date||0));
        const avg = weightedAvg(list);
        const tr = el('tr');
        const td1 = el('td'); td1.textContent = App.cache.students[sid].name;
        const td2 = el('td');
        list.forEach(g => {
          const wt = App.cache.workTypes[g.typeId];
          const title = `${wt?.name || ''} (вес ${g.weight})\n${fmt.date(g.date)}\n${g.subject}`;
          const span = el('span', {
            class: 'grade ' + gradeClass(g.value),
            title,
            style: 'margin-right:4px;',
            onclick: () => editGradeDialog(g.gid)
          }, String(g.value));
          td2.appendChild(span);
        });
        const td3 = el('td');
        td3.innerHTML = `<span class="grade ${avgClass(avg)}">${avg || '—'}</span>`;
        tr.append(td1, td2, td3);
        tb.appendChild(tr);
      });
    t.appendChild(tb);
    tableWrap.appendChild(t);

    const exp = el('button', {
      class: 'btn btn-sm btn-ghost',
      style: 'margin-top:12px;',
      onclick: () => exportCSV(byStudent)
    }, '📥 Экспорт CSV');
    tableWrap.appendChild(exp);
  }
  drawGrades();
}

async function renderStudents() {
  $('#page-title').textContent = 'Ученики';
  const c = $('#content');
  c.innerHTML = '';

  const classes = myClasses();
  const hasClasses = Object.keys(classes).length > 0;

  const card = el('div', { class: 'card' });
  card.appendChild(el('div', { class: 'card-header' },
    el('div', { class: 'card-title' }, 'Все мои ученики'),
    hasClasses
      ? el('button', { class: 'btn btn-primary btn-sm', onclick: addStudentsDialog }, '+ Добавить учеников')
      : el('span', { class: 'hint' }, 'Сначала создайте класс в разделе «🎓 Классы»')
  ));

  const myClassIds = Object.keys(classes);
  const students = Object.entries(App.cache.students)
    .filter(([,s]) => myClassIds.includes(s.classId))
    .sort((a,b) => a[1].name.localeCompare(b[1].name));

  if (!students.length) {
    card.appendChild(el('div', { class: 'empty' },
      hasClasses ? 'Учеников пока нет — нажмите «+ Добавить учеников»' : 'Учеников пока нет'));
  } else {
    const t = el('table');
    t.innerHTML = `<thead><tr><th>#</th><th>ФИО</th><th>Класс</th><th>Средний</th></tr></thead>`;
    const tb = el('tbody');
    students.forEach(([sid, s], idx) => {
      const cl = App.cache.classes[s.classId];
      const avg = avgForStudent(sid, s.classId);
      const tr = el('tr');
      tr.innerHTML = `
        <td>${idx + 1}</td>
        <td>${s.name}</td>
        <td>${cl?.name || '—'}</td>
        <td><span class="grade ${avgClass(avg)}">${avg || '—'}</span></td>`;
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    card.appendChild(t);
  }
  c.appendChild(card);
}

function weightedAvg(list) {
  const sum = list.reduce((a, g) => a + g.value * g.weight, 0);
  const w   = list.reduce((a, g) => a + g.weight, 0);
  return w ? Math.round(sum / w * 100) / 100 : 0;
}
function avgForStudent(studentId, classId) {
  const list = Object.values(App.cache.grades)
    .filter(g => g.studentId === studentId && (!classId || g.classId === classId));
  return weightedAvg(list);
}
function countStudentsBySchool() {
  const schoolClasses = Object.entries(App.cache.classes)
    .filter(([,cl]) => cl.schoolId === App.profile.schoolId).map(([id]) => id);
  return Object.values(App.cache.students).filter(s => schoolClasses.includes(s.classId)).length;
}
function countStudentsInMyClasses() {
  const ids = Object.keys(myClasses());
  return Object.values(App.cache.students).filter(s => ids.includes(s.classId)).length;
}
function countMyGrades() {
  return Object.values(App.cache.grades).filter(g => g.teacherId === App.user.uid).length;
}

/* ============================================================
   ЭКСПОРТ
============================================================ */
function exportCSV(byStudent) {
  let csv = 'Ученик;Предмет;Дата;Тип;Вес;Оценка\n';
  Object.entries(byStudent).forEach(([sid, list]) => {
    const name = App.cache.students[sid]?.name || '';
    list.forEach(g => {
      const wt = App.cache.workTypes[g.typeId]?.name || '';
      csv += [name, g.subject, fmt.date(g.date), wt, g.weight, g.value].join(';') + '\n';
    });
  });
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'grades.csv'; a.click();
  URL.revokeObjectURL(url);
}

/* ============================================================
   ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
============================================================ */
function showLoader(text) {
  $('#loader-text').textContent = text || 'Загрузка…';
  $('#loader-screen').style.display = 'flex';
  $('#auth-screen').style.display = 'none';
  $('#app-screen').style.display = 'none';
}
function showAuth() {
  $('#loader-screen').style.display = 'none';
  $('#auth-screen').style.display = 'flex';
  $('#app-screen').style.display = 'none';
}
function showApp() {
  $('#loader-screen').style.display = 'none';
  $('#auth-screen').style.display = 'none';
  $('#app-screen').style.display = 'flex';
}

/* ============================================================
   СТАРТ
============================================================ */
async function startApp(user, profile) {
  App.user = user;
  App.profile = profile;
  showLoader('Загрузка данных…');

  $('#user-name').textContent = profile.name || profile.login || '';
  $('#user-role').textContent = profile.role || '';

  try {
    await loadAll();
    buildMenu();
    showApp();
    if (!location.hash) location.hash = '#dashboard';
    router();
  } catch (err) {
    console.error(err);
    toast('Ошибка загрузки данных: ' + err.message, 'error');
    showApp();
  }
}

/* ============================================================
   ВЫХОД
============================================================ */
$('#logout-btn').onclick = async () => {
  const btn = $('#logout-btn');
  btn.disabled = true;
  btn.textContent = 'Выход…';

  clearSession();
  App.user = null;
  App.profile = null;

  try { await auth.signOut(); } catch (e) {}

  location.reload();
};

$('#menu-toggle').onclick = () => $('#sidebar').classList.toggle('open');

/* ============================================================
   ВОССТАНОВЛЕНИЕ СЕССИИ
============================================================ */
(async () => {
  showLoader('Загрузка…');

  const session = getSession();
  if (session && session.user && session.profile) {
    await startApp(session.user, session.profile);
    return;
  }

  auth.onAuthStateChanged(async (fbUser) => {
    if (!fbUser) {
      showAuth();
      return;
    }
    showLoader('Загрузка профиля…');
    try {
      const snap = await db.ref('users/' + fbUser.uid).once('value');
      if (!snap.exists()) {
        toast('Профиль пользователя не найден в базе', 'error');
        await auth.signOut();
        showAuth();
        return;
      }
      const profile = snap.val();
      setSession({ uid: fbUser.uid, email: fbUser.email }, profile);
      await startApp({ uid: fbUser.uid, email: fbUser.email }, profile);
    } catch (err) {
      console.error(err);
      toast('Ошибка загрузки профиля: ' + err.message, 'error');
      showAuth();
    }
  });
})();
</script>
