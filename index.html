<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Класс Жур — электронный журнал</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='28' fill='%230EA5E9'/><path d='M25 40 Q60 30 60 40 Q60 30 95 40 L95 82 Q60 72 60 82 Q60 72 25 82 Z' fill='%23FFFFFF'/><line x1='60' y1='40' x2='60' y2='82' stroke='%230EA5E9' stroke-width='2'/><path d='M42 60 L56 74 L84 46' stroke='%23FACC15' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
<style>
:root{
  --bg:#F8FAFC;
  --bg-elev:#FFFFFF;
  --text:#0F172A;
  --text-muted:#64748B;
  --border:#E2E8F0;

  --primary:#0EA5E9;
  --primary-hover:#0284C7;
  --accent:#A855F7;
  --brand-yellow:#FACC15;

  --danger:#EF4444;
  --success:#10B981;
  --warning:#F59E0B;

  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 10px 25px rgba(14,165,233,.18);
  --radius:12px;
  --radius-lg:18px;
  --transition:.2s ease;
}
[data-theme="dark"]{
  --bg:#0F172A;
  --bg-elev:#1E293B;
  --text:#E2E8F0;
  --text-muted:#94A3B8;
  --border:#334155;

  --primary:#38BDF8;
  --primary-hover:#7DD3FC;
  --accent:#C084FC;
  --brand-yellow:#FDE047;

  --shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 10px 25px rgba(56,189,248,.25);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;
  transition:background var(--transition),color var(--transition);
}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit}

/* ============================================================
   БРЕНД
============================================================ */
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{flex-shrink:0;filter:drop-shadow(0 4px 10px rgba(14,165,233,.25))}
.brand-text{line-height:1.1}
.brand-name{
  font-size:16px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.brand-tag{
  font-size:10px;color:var(--text-muted);text-transform:uppercase;
  letter-spacing:.08em;font-weight:600;margin-top:2px;
}

/* ============================================================
   ИКОНКИ (общие правила)
============================================================ */
.btn svg{flex-shrink:0}
.nav-item svg{flex-shrink:0}
.nav-item span{flex:1}

/* ============================================================
   AUTH
============================================================ */
#auth-screen{
  display:flex;align-items:center;justify-content:center;min-height:100vh;
  padding:20px;
  background:linear-gradient(135deg,#0EA5E9 0%,#38BDF8 40%,#A855F7 100%);
  position:relative;overflow:hidden;
}
#auth-screen::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 15% 20%, rgba(250,204,21,.15), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(168,85,247,.25), transparent 50%);
  pointer-events:none;
}
.auth-card{
  background:var(--bg-elev);border-radius:var(--radius-lg);padding:36px;
  max-width:430px;width:100%;box-shadow:var(--shadow-lg);
  animation:slideUp .4s ease;position:relative;z-index:1;
}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .brand-logo{margin:0 auto 14px;display:block}
.auth-logo h1{
  font-size:26px;margin-bottom:6px;letter-spacing:-.03em;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.auth-subtitle{color:var(--text-muted);font-size:13px;font-weight:500}
.auth-slogan{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:12px;padding:5px 14px;
  background:linear-gradient(135deg,rgba(14,165,233,.12),rgba(168,85,247,.12));
  color:var(--primary);font-size:11px;font-weight:700;
  border-radius:20px;letter-spacing:.02em;
}
.auth-slogan svg{color:var(--brand-yellow)}

.auth-tabs{display:flex;background:var(--bg);border-radius:var(--radius);padding:4px;margin-bottom:20px}
.auth-tab{
  flex:1;padding:9px;border:none;background:transparent;
  color:var(--text-muted);font-weight:600;border-radius:9px;
  cursor:pointer;transition:var(--transition);font-size:13px;
}
.auth-tab.active{background:var(--bg-elev);color:var(--text);box-shadow:var(--shadow)}
.auth-form{display:none}
.auth-form.active{display:block;animation:fadeIn .3s ease}

/* ============================================================
   FORMS
============================================================ */
.form-group{margin-bottom:14px}
.form-group label{
  display:block;font-size:11px;font-weight:700;color:var(--text-muted);
  margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;
}
input,select,textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--border);
  background:var(--bg);color:var(--text);border-radius:10px;
  font-size:14px;font-family:inherit;transition:var(--transition);
}
textarea{resize:vertical;min-height:100px}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--primary);background:var(--bg-elev);
  box-shadow:0 0 0 4px rgba(14,165,233,.15);
}

/* ============================================================
   BUTTONS
============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 18px;border:1px solid transparent;border-radius:10px;
  font-size:14px;font-weight:600;cursor:pointer;
  transition:var(--transition);white-space:nowrap;
}
.btn-primary{
  background:linear-gradient(135deg,var(--primary),#38BDF8);
  color:#fff;
  box-shadow:0 4px 12px rgba(14,165,233,.28);
}
.btn-primary:hover{
  background:linear-gradient(135deg,var(--primary-hover),var(--primary));
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(14,165,233,.4);
}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{
  background:transparent;color:var(--text);border:1.5px solid var(--border);
}
.btn-ghost:hover{background:var(--bg);border-color:var(--primary);color:var(--primary)}
.btn-block{width:100%}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px;gap:5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.auth-link{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted);font-weight:500}
.auth-link:hover{color:var(--primary)}
.auth-message{margin-top:16px;padding:11px 14px;border-radius:10px;font-size:13px;display:none}
.auth-message.error{display:block;background:rgba(239,68,68,.1);color:var(--danger)}
.auth-message.success{display:block;background:rgba(16,185,129,.1);color:var(--success)}
.auth-message.info{display:block;background:rgba(14,165,233,.1);color:var(--primary)}

/* ============================================================
   APP
============================================================ */
#app-screen{display:flex;min-height:100vh}
.sidebar{
  width:250px;background:var(--bg-elev);border-right:1px solid var(--border);
  display:flex;flex-direction:column;transition:transform var(--transition);
}
.sidebar-header{padding:22px 20px;border-bottom:1px solid var(--border)}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 13px;
  border-radius:10px;color:var(--text-muted);cursor:pointer;
  font-size:14px;font-weight:500;margin-bottom:2px;
  transition:var(--transition);position:relative;
}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{
  background:linear-gradient(135deg,rgba(14,165,233,.12),rgba(168,85,247,.08));
  color:var(--primary);font-weight:600;
}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:20px;background:var(--primary);
  border-radius:0 3px 3px 0;
}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
.sidebar-footer .btn{flex:1}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  display:flex;align-items:center;gap:16px;padding:18px 26px;
  background:var(--bg-elev);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10;
  backdrop-filter:saturate(180%) blur(10px);
}
.topbar h1{font-size:20px;flex:1;font-weight:700;letter-spacing:-.01em}
.user-info{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500}
.badge{
  padding:5px 11px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;border-radius:20px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;
}
.content{padding:26px;flex:1}
.only-mobile{display:none}
@media (max-width:768px){
  .only-mobile{display:inline-flex}
  .sidebar{position:fixed;z-index:100;height:100%;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  .content{padding:16px}
}

/* ============================================================
   CARDS
============================================================ */
.card{
  background:var(--bg-elev);border-radius:var(--radius);padding:22px;
  box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--border);
}
.card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;gap:12px;flex-wrap:wrap;
}
.card-title{font-size:16px;font-weight:700;letter-spacing:-.01em}

.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.stat-card{
  background:var(--bg-elev);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);transition:var(--transition);
  border:1px solid var(--border);position:relative;overflow:hidden;
}
.stat-card::after{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  opacity:0;transition:var(--transition);
}
.stat-card:hover{
  transform:translateY(-3px);box-shadow:var(--shadow-lg);
  border-color:transparent;
}
.stat-card:hover::after{opacity:1}
.stat-label{
  font-size:11px;color:var(--text-muted);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:8px;font-weight:700;
}
.stat-value{font-size:28px;font-weight:800;letter-spacing:-.02em}

/* ============================================================
   TABLE
============================================================ */
table{
  width:100%;border-collapse:collapse;font-size:13px;
  background:var(--bg-elev);border-radius:var(--radius);overflow:hidden;
}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border)}
th{
  background:var(--bg);font-weight:700;font-size:11px;text-transform:uppercase;
  color:var(--text-muted);letter-spacing:.05em;
}
tbody tr{transition:var(--transition)}
tbody tr:hover{background:rgba(14,165,233,.04)}
tbody tr:last-child td{border-bottom:none}

.empty{padding:44px;text-align:center;color:var(--text-muted)}
.empty-icon{font-size:44px;display:block;margin-bottom:10px;opacity:.4}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input,.toolbar select{width:auto;min-width:160px}

/* ============================================================
   GRADES
============================================================ */
.grade{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:32px;height:32px;padding:0 9px;border-radius:9px;
  font-weight:800;color:#fff;cursor:pointer;transition:var(--transition);
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}
.grade:hover{transform:scale(1.1) rotate(-3deg)}
.grade-5{background:linear-gradient(135deg,#10B981,#059669)}
.grade-4{background:linear-gradient(135deg,#84CC16,#65A30D)}
.grade-3{background:linear-gradient(135deg,#F59E0B,#D97706)}
.grade-2{background:linear-gradient(135deg,#EF4444,#DC2626)}
.grade-avg{background:linear-gradient(135deg,var(--primary),var(--accent))}

/* ============================================================
   MODAL
============================================================ */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(15,23,42,.55);
  backdrop-filter:blur(4px);display:flex;
  align-items:center;justify-content:center;z-index:200;
  padding:20px;animation:fadeIn .2s ease;
}
.modal{
  background:var(--bg-elev);border-radius:var(--radius-lg);padding:26px;
  max-width:500px;width:100%;max-height:90vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);animation:slideUp .25s ease;
}
.modal-title{
  font-size:18px;margin-bottom:18px;font-weight:800;letter-spacing:-.01em;
  display:flex;align-items:center;gap:10px;
}
.modal-title svg{color:var(--primary);flex-shrink:0}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}

/* ============================================================
   TOAST
============================================================ */
.toast-root{
  position:fixed;top:20px;right:20px;z-index:300;
  display:flex;flex-direction:column;gap:10px;pointer-events:none;
}
.toast{
  background:var(--bg-elev);color:var(--text);padding:14px 18px;
  border-radius:12px;box-shadow:var(--shadow-lg);font-size:13px;
  animation:slideIn .3s ease;pointer-events:auto;max-width:340px;
  border-left:4px solid var(--primary);font-weight:500;
  display:flex;align-items:flex-start;gap:10px;
}
.toast svg{flex-shrink:0;margin-top:1px}
.toast.success{border-left-color:var(--success)}
.toast.success svg{color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.error svg{color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}
.toast.warning svg{color:var(--warning)}
.toast.info svg{color:var(--primary)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

/* ============================================================
   INVITE CODE
============================================================ */
.invite-code{
  display:inline-flex;align-items:center;gap:8px;
  font-family:"Courier New",monospace;background:var(--bg);
  padding:8px 14px;border-radius:9px;font-weight:800;
  font-size:16px;letter-spacing:.12em;color:var(--primary);
  border:1.5px dashed rgba(14,165,233,.3);
}
.invite-code.used{opacity:.45;text-decoration:line-through;color:var(--text-muted)}

/* ============================================================
   LOADER
============================================================ */
.loader{
  position:fixed;inset:0;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;z-index:999;
}
.spinner{
  width:40px;height:40px;border:3px solid var(--border);
  border-top-color:var(--primary);border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.hint{
  font-size:12px;color:var(--text-muted);margin-top:6px;line-height:1.5;
  display:flex;align-items:center;gap:6px;
}
.hint svg{flex-shrink:0}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.brand-logo{animation:pulse 3s ease-in-out infinite}
</style>
</head>
<body>

<div id="loader-screen" class="loader">
  <svg width="80" height="80" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <rect width="120" height="120" rx="28" fill="#0EA5E9"/>
    <path d="M25 40 Q60 30 60 40 Q60 30 95 40 L95 82 Q60 72 60 82 Q60 72 25 82 Z" fill="#FFFFFF"/>
    <line x1="60" y1="40" x2="60" y2="82" stroke="#0EA5E9" stroke-width="2"/>
    <path d="M42 60 L56 74 L84 46" stroke="#FACC15" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>
  <div id="loader-text" style="color:var(--text-muted);font-size:13px;font-weight:600;">
    Загрузка…
  </div>
</div>

<div id="auth-screen" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">
      <svg class="brand-logo" width="88" height="88" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <rect width="120" height="120" rx="28" fill="#0EA5E9"/>
        <path d="M25 40 Q60 30 60 40 Q60 30 95 40 L95 82 Q60 72 60 82 Q60 72 25 82 Z" fill="#FFFFFF"/>
        <line x1="60" y1="40" x2="60" y2="82" stroke="#0EA5E9" stroke-width="2"/>
        <path d="M42 60 L56 74 L84 46" stroke="#FACC15" stroke-width="6"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <h1>Класс Жур</h1>
      <p class="auth-subtitle">Электронный журнал для школ</p>
      <span class="auth-slogan">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4-6.2-4.6-6.2 4.6 2.4-7.4L2 9.4h7.6z"/>
        </svg>
        Оценки — под контролем
      </span>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Вход</button>
      <button class="auth-tab" data-tab="register">Регистрация</button>
    </div>

    <form id="login-form" class="auth-form active">
      <div class="form-group">
        <label>Логин или Email</label>
        <input type="text" id="login-input" required placeholder="admin">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="login-password" required placeholder="••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Войти</button>
      <a href="#" id="forgot-password" class="auth-link">Забыли пароль?</a>
    </form>

    <form id="register-form" class="auth-form">
      <div class="form-group">
        <label>Код приглашения</label>
        <input type="text" id="invite-code" required placeholder="ABC123">
      </div>
      <div class="form-group">
        <label>ФИО</label>
        <input type="text" id="reg-name" required placeholder="Иванов Иван Иванович">
      </div>
      <div class="form-group">
        <label>Логин</label>
        <input type="text" id="reg-login" required placeholder="ivanov">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" required placeholder="ivanov@mail.ru">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="reg-password" required minlength="6" placeholder="минимум 6 символов">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
    </form>

    <div id="auth-message" class="auth-message"></div>
  </div>
</div>

<div id="app-screen" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <svg class="brand-logo" width="42" height="42" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <rect width="120" height="120" rx="28" fill="#0EA5E9"/>
          <path d="M25 40 Q60 30 60 40 Q60 30 95 40 L95 82 Q60 72 60 82 Q60 72 25 82 Z" fill="#FFFFFF"/>
          <line x1="60" y1="40" x2="60" y2="82" stroke="#0EA5E9" stroke-width="2"/>
          <path d="M42 60 L56 74 L84 46" stroke="#FACC15" stroke-width="6"
                stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <div class="brand-text">
          <div class="brand-name">Класс Жур</div>
          <div class="brand-tag">электронный журнал</div>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button id="theme-toggle" class="btn btn-ghost" title="Сменить тему"></button>
      <button id="logout-btn" class="btn btn-ghost"></button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button id="menu-toggle" class="btn btn-ghost only-mobile">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <h1 id="page-title">Дашборд</h1>
      <div class="user-info">
        <span id="user-name"></span>
        <span class="badge" id="user-role"></span>
      </div>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
/* ============================================================
   КОНФИГУРАЦИЯ FIREBASE
============================================================ */

const SESSION_KEY = 'ej_session_v1';

function getSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function setSession(user, profile) {
  localStorage.setItem(SESSION_KEY, JSON.stringify({ user, profile }));
}
function clearSession() {
  localStorage.removeItem(SESSION_KEY);
}

const $  = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const el = (tag, props = {}, ...children) => {
  const n = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v);
  });
  children.flat().forEach(c => n.append(c?.nodeType ? c : document.createTextNode(c ?? '')));
  return n;
};

const TOAST_ICONS = {
  success: 'checkCircle',
  error:   'xCircle',
  warning: 'alertCircle',
  info:    'info'
};

function toast(msg, type = 'info') {
  const iconName = TOAST_ICONS[type] || 'info';
  const t = el('div', {
    class: `toast ${type}`,
    html: `${ic(iconName, 18)}<div>${msg}</div>`
  });
  $('#toast-root').appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

function showModal(title, bodyHtml, actions = []) {
  const root = $('#modal-root');
  root.innerHTML = '';
  const backdrop = el('div', { class: 'modal-backdrop' });
  backdrop.innerHTML = `
    <div class="modal">
      <h3 class="modal-title">${title}</h3>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-actions"></div>
    </div>`;
  const actionsEl = backdrop.querySelector('.modal-actions');
  actions.forEach(a => {
    const b = el('button', {
      class: `btn ${a.class || 'btn-ghost'}`,
      onclick: () => a.onClick ? a.onClick(backdrop) : closeModal()
    }, a.label);
    actionsEl.appendChild(b);
  });
  backdrop.onclick = (e) => { if (e.target === backdrop) closeModal(); };
  root.appendChild(backdrop);
  return backdrop;
}
function closeModal() { $('#modal-root').innerHTML = ''; }

function confirmDialog(title, message) {
  return new Promise(res => {
    showModal(
      `${ic('alertCircle', 20)} ${title}`,
      `<p>${message}</p>`,
      [
        { label: 'Отмена', onClick: () => { closeModal(); res(false); } },
        { label: 'Подтвердить', class: 'btn-danger', onClick: () => { closeModal(); res(true); } }
      ]
    );
  });
}

function gradeClass(v) {
  const n = Math.round(v);
  if (n >= 5) return 'grade-5';
  if (n === 4) return 'grade-4';
  if (n === 3) return 'grade-3';
  return 'grade-2';
}
function avgClass(v) {
  if (v >= 4.5) return 'grade-5';
  if (v >= 3.5) return 'grade-4';
  if (v >= 2.5) return 'grade-3';
  return 'grade-2';
}

function translateError(err) {
  const map = {
    'auth/user-not-found':       'Пользователь не найден',
    'auth/wrong-password':       'Неверный пароль',
    'auth/invalid-email':        'Неверный email',
    'auth/invalid-credential':   'Неверный логин или пароль',

    'auth/too-many-requests':    'Слишком много попыток. Попробуйте позже.',
    'auth/network-request-failed': 'Проблема с сетью',

  return map[err.code] || err.message || 'Неизвестная ошибка';
}

function initTheme() {

  document.documentElement.dataset.theme = t;
  const btn = $('#theme-toggle');
  if (btn) {
    btn.innerHTML = t === 'dark' ? ic('sun', 16) : ic('moon', 16);
    btn.onclick = () => {
      const cur = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = cur;
      localStorage.setItem('theme', cur);
      btn.innerHTML = cur === 'dark' ? ic('sun', 16) : ic('moon', 16);
    };
  }
}

$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const loginInput = $('#login-input').value.trim();
  const password   = $('#login-password').value;
  if (!loginInput || !password) return;

  if (loginInput === HARDCODED_ADMIN.login && password === HARDCODED_ADMIN.password) {
    const user = { uid: 'admin-local', email: HARDCODED_ADMIN.profile.email };
    const profile = { ...HARDCODED_ADMIN.profile, createdAt: Date.now() };
    setSession(user, profile);
    startApp(user, profile);
    return;
  }

  try {
    let email = loginInput;
    if (!loginInput.includes('@')) {
      const snap = await db.ref('users').orderByChild('login').equalTo(loginInput).once('value');
      if (!snap.exists()) return showAuthMsg('Пользователь с таким логином не найден');
      const u = Object.values(snap.val())[0];
      email = u.email;
    }
    await auth.signInWithEmailAndPassword(email, password);
  } catch (err) {
    showAuthMsg(translateError(err));
  }
});

$('#register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code     = $('#invite-code').value.trim().toUpperCase();
  const name     = $('#reg-name').value.trim();
  const login    = $('#reg-login').value.trim();
  const email    = $('#reg-email').value.trim();
  const password = $('#reg-password').value;

  try {
    const inviteSnap = await db.ref('invites/' + code).once('value');
    if (!inviteSnap.exists()) return showAuthMsg('Неверный код приглашения');
    const invite = inviteSnap.val();
    if (invite.used) return showAuthMsg('Код уже использован');
    if (invite.expiresAt && invite.expiresAt < Date.now()) return showAuthMsg('Код истёк');

    const loginCheck = await db.ref('users').orderByChild('login').equalTo(login).once('value');
    if (loginCheck.exists()) return showAuthMsg('Такой логин уже занят');

    const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    await secondaryAuth.signOut();

    await db.ref('users/' + uid).set({
      role: invite.role || 'teacher',
      login, name, email,
      schoolId: invite.schoolId || null,
      cityId: invite.cityId || null,
      createdAt: Date.now()
    });

    await db.ref('invites/' + code).update({
      used: true, usedBy: uid, usedAt: Date.now()
    });

    showAuthMsg('Регистрация успешна! Входим…', 'success');
    setTimeout(async () => {
      await auth.signInWithEmailAndPassword(email, password);
    }, 800);
  } catch (err) {
    showAuthMsg(translateError(err));
  }
});

$('#forgot-password').onclick = async (e) => {
  e.preventDefault();
  const val = prompt('Введите ваш email для сброса пароля:');
  if (!val) return;
  try {
    await auth.sendPasswordResetEmail(val.trim());
    showAuthMsg('Письмо отправлено. Проверьте почту.', 'success');
  } catch (err) {
    showAuthMsg(translateError(err));
  }
};

function buildMenu() {
  const nav = $('#sidebar-nav');
  nav.innerHTML = '';
  const items = MENU[App.profile.role] || [];
  items.forEach(it => {
    const a = el('div', {
      class: 'nav-item' + (location.hash === '#' + it.id ? ' active' : ''),
      html: ic(it.icon, 18) + `<span>${it.label}</span>`,
      onclick: () => navigate(it.id)
    });
    nav.appendChild(a);
  });
}

function navigate(view, params = {}) {
  location.hash = '#' + view + (params.id ? '/' + params.id : '');
  router();
}

async function router() {
  const hash = location.hash.slice(1) || 'dashboard';
  const [view, id] = hash.split('/');

  if (!App.profile) return;

  const items = MENU[App.profile.role] || [];
  const allowed = items.map(i => i.id);

  const HIDDEN_VIEWS = ['class'];
  HIDDEN_VIEWS.forEach(v => { if (!allowed.includes(v)) allowed.push(v); });

  if (!allowed.includes(view)) return navigate('dashboard');

  $$('.nav-item').forEach(n => n.classList.remove('active'));
  const idx = items.findIndex(i => i.id === view);
  if (idx >= 0) $$('.nav-item')[idx]?.classList.add('active');

  const renderers = {
    dashboard: renderDashboard,
    cities:    renderCities,
    schools:   renderSchools,
    users:     renderUsers,
    invites:   renderInvites,
    classes:   renderClasses,
    class:     () => renderClassDetail(id),
    journal:   renderJournal,
    students:  renderStudents,
    worktypes: renderWorkTypes,
    profile:   renderProfile
  };
  const fn = renderers[view];
  if (fn) await fn();
  $('#sidebar').classList.remove('open');
}

window.addEventListener('hashchange', router);

async function loadAll() {
  const [cities, schools, classes, students, grades, workTypes, invites, users] =
    await Promise.all([
      db.ref('cities').once('value'),
      db.ref('schools').once('value'),
      db.ref('classes').once('value'),
      db.ref('students').once('value'),
      db.ref('grades').once('value'),
      db.ref('workTypes').once('value'),
      db.ref('invites').once('value'),
      db.ref('users').once('value')
    ]);
  App.cache.cities    = cities.val()    || {};
  App.cache.schools   = schools.val()   || {};
  App.cache.classes   = classes.val()   || {};
  App.cache.students  = students.val()  || {};
  App.cache.grades    = grades.val()    || {};
  App.cache.workTypes = workTypes.val() || {};
  App.cache.invites   = invites.val()   || {};
  App.cache.users     = users.val()     || {};
}

function mySchools() {
  const s = App.cache.schools;
  if (App.profile.role === 'super_admin') return s;
  if (App.profile.role === 'city_creator')
    return Object.fromEntries(Object.entries(s).filter(([,v]) => v.cityId === App.profile.cityId));
  if (App.profile.role === 'school_creator' || App.profile.role === 'teacher')
    return Object.fromEntries(Object.entries(s).filter(([k]) => k === App.profile.schoolId));
  return {};
}
function myClasses() {
  return Object.fromEntries(
    Object.entries(App.cache.classes).filter(([,c]) => c.teacherId === App.user.uid)
  );
}

async function renderJournal() {
  $('#page-title').textContent = 'Журнал оценок';
  const c = $('#content');
  c.innerHTML = '';
  const classes = myClasses();
  if (!Object.keys(classes).length) {
    c.appendChild(el('div', { class: 'card empty' }, 'Сначала создайте класс'));
    return;
  }
  const card = el('div', { class: 'card' });
  const toolbar = el('div', { class: 'toolbar' });

  const classSel = el('select');
  classSel.innerHTML = '<option value="">— Все классы —</option>';
  Object.entries(classes).forEach(([id, cl]) =>
    classSel.appendChild(el('option', { value: id }, cl.name)));

  const subjectSel = el('select');
  subjectSel.innerHTML = '<option value="">— Все предметы —</option>';

  const searchInput = el('input', { placeholder: 'Поиск ученика...', type: 'text' });

  const updateSubjects = () => {
    const cid = classSel.value;
    subjectSel.innerHTML = '<option value="">— Все предметы —</option>';
    if (cid && classes[cid].subjects) {
      classes[cid].subjects.forEach(s => subjectSel.appendChild(el('option', { value: s }, s)));
    }
  };
  classSel.onchange = () => { updateSubjects(); drawGrades(); };
  subjectSel.onchange = drawGrades;
  searchInput.oninput = drawGrades;

  toolbar.append(classSel, subjectSel, searchInput);
  card.appendChild(el('div', { class: 'card-header' },
    el('div', { class: 'card-title' }, 'Оценки'),
    el('button', {
      class: 'btn btn-primary btn-sm',
      html: ic('plus', 14) + ' Выставить оценку',
      onclick: () => addGradeDialog(classSel.value)
    })
  ));
  card.appendChild(toolbar);

  const tableWrap = el('div');
  card.appendChild(tableWrap);
  c.appendChild(card);

  function drawGrades() {
    tableWrap.innerHTML = '';
    const cid = classSel.value;
    const subj = subjectSel.value;
    const q = searchInput.value.toLowerCase().trim();

    let grades = Object.entries(App.cache.grades).filter(([,g]) => g.teacherId === App.user.uid);
    if (cid) grades = grades.filter(([,g]) => g.classId === cid);
    if (subj) grades = grades.filter(([,g]) => g.subject === subj);

    const byStudent = {};
    grades.forEach(([gid, g]) => {
      const s = App.cache.students[g.studentId];
      if (!s) return;
      if (q && !s.name.toLowerCase().includes(q)) return;
      (byStudent[g.studentId] ||= []).push({ gid, ...g });
    });

    if (!Object.keys(byStudent).length) {
      tableWrap.appendChild(el('div', { class: 'empty' }, 'Оценок не найдено'));
      return;
    }

    const t = el('table');
    t.innerHTML = `<thead><tr><th>Ученик</th><th>Оценки</th><th>Средний</th></tr></thead>`;
    const tb = el('tbody');
    Object.entries(byStudent)
      .sort((a,b) => App.cache.students[a[0]].name.localeCompare(App.cache.students[b[0]].name))
      .forEach(([sid, list]) => {
        list.sort((a,b) => (a.date||0) - (b.date||0));
        const avg = weightedAvg(list);
        const tr = el('tr');
        const td1 = el('td'); td1.textContent = App.cache.students[sid].name;
        const td2 = el('td');
        list.forEach(g => {
          const wt = App.cache.workTypes[g.typeId];
          const title = `${wt?.name || ''} (вес ${g.weight})\n${fmt.date(g.date)}\n${g.subject}`;
          const span = el('span', {
            class: 'grade ' + gradeClass(g.value),
            title,
            style: 'margin-right:4px;',
            onclick: () => editGradeDialog(g.gid)
          }, String(g.value));
          td2.appendChild(span);
        });
        const td3 = el('td');
        td3.innerHTML = `<span class="grade ${avgClass(avg)}">${avg || '—'}</span>`;
        tr.append(td1, td2, td3);
        tb.appendChild(tr);
      });
    t.appendChild(tb);
    tableWrap.appendChild(t);

    const exp = el('button', {
      class: 'btn btn-sm btn-ghost',
      style: 'margin-top:12px;',
      html: ic('download', 14) + ' Экспорт CSV',
      onclick: () => exportCSV(byStudent)
    });
    tableWrap.appendChild(exp);
  }
  drawGrades();
}

      const subject = document.getElementById('m-g-subject').value;
      const typeId = document.getElementById('m-g-type').value;
      const date = new Date(document.getElementById('m-g-date').value).getTime();

   ВЫЧИСЛЕНИЯ
============================================================ */
function weightedAvg(list) {
  const sum = list.reduce((a, g) => a + g.value * g.weight, 0);
  const w   = list.reduce((a, g) => a + g.weight, 0);
  return w ? Math.round(sum / w * 100) / 100 : 0;
}
function avgForStudent(studentId, classId) {
  const list = Object.values(App.cache.grades)
    .filter(g => g.studentId === studentId && (!classId || g.classId === classId));
  return weightedAvg(list);
}
function countStudentsBySchool() {
  const schoolClasses = Object.entries(App.cache.classes)
    .filter(([,cl]) => cl.schoolId === App.profile.schoolId).map(([id]) => id);
  return Object.values(App.cache.students).filter(s => schoolClasses.includes(s.classId)).length;
}
function countStudentsInMyClasses() {
  const ids = Object.keys(myClasses());
  return Object.values(App.cache.students).filter(s => ids.includes(s.classId)).length;
}
function countMyGrades() {
  return Object.values(App.cache.grades).filter(g => g.teacherId === App.user.uid).length;
}

============================================================ */
function exportCSV(byStudent) {
  let csv = 'Ученик;Предмет;Дата;Тип;Вес;Оценка\n';
  Object.entries(byStudent).forEach(([sid, list]) => {
    const name = App.cache.students[sid]?.name || '';
    list.forEach(g => {
      const wt = App.cache.workTypes[g.typeId]?.name || '';
      csv += [name, g.subject, fmt.date(g.date), wt, g.weight, g.value].join(';') + '\n';
    });
  });
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'grades.csv'; a.click();
  URL.revokeObjectURL(url);
}

  $('#user-role').textContent = profile.role || '';

  auth.onAuthStateChanged(async (fbUser) => {
    if (!fbUser) {
      showAuth();
      return;
    }
    showLoader('Загрузка профиля…');
    try {
      const snap = await db.ref('users/' + fbUser.uid).once('value');
      if (!snap.exists()) {
        toast('Профиль пользователя не найден в базе', 'error');
        await auth.signOut();
        showAuth();
        return;
      }
      const profile = snap.val();
      setSession({ uid: fbUser.uid, email: fbUser.email }, profile);
      await startApp({ uid: fbUser.uid, email: fbUser.email }, profile);
    } catch (err) {
      console.error(err);
      toast('Ошибка загрузки профиля: ' + err.message, 'error');
      showAuth();
    }
  });
})();
</script>
</body>
</html>
