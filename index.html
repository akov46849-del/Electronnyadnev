<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Класс Жур — электронный журнал</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='28' fill='%230EA5E9'/><path d='M25 40 Q60 30 60 40 Q60 30 95 40 L95 82 Q60 72 60 82 Q60 72 25 82 Z' fill='%23FFFFFF'/><line x1='60' y1='40' x2='60' y2='82' stroke='%230EA5E9' stroke-width='2'/><path d='M42 60 L56 74 L84 46' stroke='%23FACC15' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
<style>
:root{
  --bg:#F8FAFC;--bg-elev:#FFFFFF;--text:#0F172A;--text-muted:#64748B;--border:#E2E8F0;
  --primary:#0EA5E9;--primary-hover:#0284C7;--accent:#A855F7;--brand-yellow:#FACC15;
  --danger:#EF4444;--success:#10B981;--warning:#F59E0B;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 10px 25px rgba(14,165,233,.18);
  --radius:12px;--radius-lg:18px;--transition:.2s ease;
}
[data-theme="dark"]{
  --bg:#0F172A;--bg-elev:#1E293B;--text:#E2E8F0;--text-muted:#94A3B8;--border:#334155;
  --primary:#38BDF8;--primary-hover:#7DD3FC;--accent:#C084FC;--brand-yellow:#FDE047;
  --shadow:0 1px 3px rgba(0,0,0,.4);--shadow-lg:0 10px 25px rgba(56,189,248,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;
  transition:background var(--transition),color var(--transition);}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit}

.brand{display:flex;align-items:center;gap:12px}
.brand-logo{flex-shrink:0;filter:drop-shadow(0 4px 10px rgba(14,165,233,.25))}
.brand-text{line-height:1.1}
.brand-name{font-size:16px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
.brand-tag{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:2px;}

.btn svg{flex-shrink:0}
.nav-item svg{flex-shrink:0}
.nav-item span{flex:1}

#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
  background:linear-gradient(135deg,#0EA5E9 0%,#38BDF8 40%,#A855F7 100%);position:relative;overflow:hidden;}
#auth-screen::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 15% 20%,rgba(250,204,21,.15),transparent 45%),
             radial-gradient(circle at 85% 80%,rgba(168,85,247,.25),transparent 50%);pointer-events:none;}
.auth-card{background:var(--bg-elev);border-radius:var(--radius-lg);padding:36px;max-width:430px;width:100%;
  box-shadow:var(--shadow-lg);animation:slideUp .4s ease;position:relative;z-index:1;}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .brand-logo{margin:0 auto 14px;display:block}
.auth-logo h1{font-size:26px;margin-bottom:6px;letter-spacing:-.03em;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
.auth-subtitle{color:var(--text-muted);font-size:13px;font-weight:500}
.auth-slogan{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:5px 14px;
  background:linear-gradient(135deg,rgba(14,165,233,.12),rgba(168,85,247,.12));
  color:var(--primary);font-size:11px;font-weight:700;border-radius:20px;}
.auth-slogan svg{color:var(--brand-yellow)}
.auth-tabs{display:flex;background:var(--bg);border-radius:var(--radius);padding:4px;margin-bottom:20px}
.auth-tab{flex:1;padding:9px;border:none;background:transparent;color:var(--text-muted);
  font-weight:600;border-radius:9px;cursor:pointer;transition:var(--transition);font-size:13px;}
.auth-tab.active{background:var(--bg-elev);color:var(--text);box-shadow:var(--shadow)}
.auth-form{display:none}
.auth-form.active{display:block;animation:fadeIn .3s ease}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:700;color:var(--text-muted);
  margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);background:var(--bg);
  color:var(--text);border-radius:10px;font-size:14px;font-family:inherit;transition:var(--transition);}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);background:var(--bg-elev);
  box-shadow:0 0 0 4px rgba(14,165,233,.15);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;
  border:1px solid transparent;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
  transition:var(--transition);white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,var(--primary),#38BDF8);color:#fff;
  box-shadow:0 4px 12px rgba(14,165,233,.28);}
.btn-primary:hover{background:linear-gradient(135deg,var(--primary-hover),var(--primary));
  transform:translateY(-1px);box-shadow:0 6px 18px rgba(14,165,233,.4);}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--border);}
.btn-ghost:hover{background:var(--bg);border-color:var(--primary);color:var(--primary)}
.btn-block{width:100%}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px;gap:5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.auth-link{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted);font-weight:500}
.auth-link:hover{color:var(--primary)}
.auth-message{margin-top:16px;padding:11px 14px;border-radius:10px;font-size:13px;display:none}
.auth-message.error{display:block;background:rgba(239,68,68,.1);color:var(--danger)}
.auth-message.success{display:block;background:rgba(16,185,129,.1);color:var(--success)}

#app-screen{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--bg-elev);border-right:1px solid var(--border);
  display:flex;flex-direction:column;transition:transform var(--transition);}
.sidebar-header{padding:22px 20px;border-bottom:1px solid var(--border)}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;
  color:var(--text-muted);cursor:pointer;font-size:14px;font-weight:500;margin-bottom:2px;
  transition:var(--transition);position:relative;}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,rgba(14,165,233,.12),rgba(168,85,247,.08));
  color:var(--primary);font-weight:600;}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:20px;background:var(--primary);border-radius:0 3px 3px 0;}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
.sidebar-footer .btn{flex:1}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:16px;padding:18px 26px;background:var(--bg-elev);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;
  backdrop-filter:saturate(180%) blur(10px);}
.topbar h1{font-size:20px;flex:1;font-weight:700;letter-spacing:-.01em}
.user-info{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500}
.badge{padding:5px 11px;background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.content{padding:26px;flex:1}
.only-mobile{display:none}
@media (max-width:768px){
  .only-mobile{display:inline-flex}
  .sidebar{position:fixed;z-index:100;height:100%;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  .content{padding:16px}
  .topbar{padding:14px 16px}
  .topbar h1{font-size:16px}
}
.card{background:var(--bg-elev);border-radius:var(--radius);padding:22px;
  box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--border);}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;
  gap:12px;flex-wrap:wrap;}
.card-title{font-size:16px;font-weight:700;letter-spacing:-.01em}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat-card{background:var(--bg-elev);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);transition:var(--transition);border:1px solid var(--border);
  position:relative;overflow:hidden;}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--primary),var(--accent));opacity:0;transition:var(--transition);}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:transparent;}
.stat-card:hover::after{opacity:1}
.stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:8px;font-weight:700;}
.stat-value{font-size:28px;font-weight:800;letter-spacing:-.02em}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--bg-elev);
  border-radius:var(--radius);overflow:hidden;}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--bg);font-weight:700;font-size:11px;text-transform:uppercase;
  color:var(--text-muted);letter-spacing:.05em;}
tbody tr{transition:var(--transition)}
tbody tr:hover{background:rgba(14,165,233,.04)}
tbody tr:last-child td{border-bottom:none}
.empty{padding:44px;text-align:center;color:var(--text-muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input,.toolbar select{width:auto;min-width:160px}
.grade{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;
  padding:0 8px;border-radius:8px;font-weight:800;color:#fff;cursor:pointer;transition:var(--transition);}
.grade-5{background:#10B981}
.grade-4{background:#84CC16}
.grade-3{background:#F59E0B}
.grade-2{background:#EF4444}
.grade-1{background:#991B1B}
.grade:hover{transform:scale(1.08)}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fadeIn .2s ease;}
.modal{background:var(--bg-elev);border-radius:var(--radius-lg);padding:26px;max-width:520px;width:100%;
  max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .25s ease;}
.modal-wide{max-width:680px}
.modal-title{font-size:18px;margin-bottom:18px;font-weight:800;letter-spacing:-.01em;
  display:flex;align-items:center;gap:10px;}
.modal-title svg{color:var(--primary);flex-shrink:0}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.toast-root{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
.toast{background:var(--bg-elev);color:var(--text);padding:14px 18px;border-radius:12px;
  box-shadow:var(--shadow-lg);font-size:13px;animation:slideIn .3s ease;pointer-events:auto;
  max-width:340px;border-left:4px solid var(--primary);font-weight:500;display:flex;
  align-items:flex-start;gap:10px;}
.toast svg{flex-shrink:0;margin-top:1px}
.toast.success{border-left-color:var(--success)}
.toast.success svg{color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.error svg{color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}
.toast.warning svg{color:var(--warning)}
.toast.info svg{color:var(--primary)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.invite-code{display:inline-flex;align-items:center;gap:8px;font-family:"Courier New",monospace;
  background:var(--bg);padding:8px 14px;border-radius:9px;font-weight:800;font-size:16px;
  letter-spacing:.12em;color:var(--primary);border:1.5px dashed rgba(14,165,233,.3);}
.invite-code.used{opacity:.45;text-decoration:line-through;color:var(--text-muted)}
.loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;z-index:999;}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:12px;color:var(--text-muted);margin-top:6px;line-height:1.5;
  display:flex;align-items:center;gap:6px;}
.hint svg{flex-shrink:0}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.brand-logo{animation:pulse 3s ease-in-out infinite}

/* Чекбоксы предметов */
.subjects-toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.subjects-toolbar input{flex:1;min-width:140px}
.subjects-box{max-height:340px;overflow-y:auto;border:1.5px solid var(--border);
  border-radius:10px;padding:12px;background:var(--bg);}
.subject-group{margin-bottom:14px}
.subject-group:last-child{margin-bottom:0}
.subject-group-title{font-size:11px;text-transform:uppercase;color:var(--text-muted);
  font-weight:700;letter-spacing:.05em;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.subject-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;
  cursor:pointer;transition:var(--transition);font-size:13px;user-select:none;}
.subject-item:hover{background:var(--bg-elev)}
.subject-item.checked{background:linear-gradient(135deg,rgba(14,165,233,.12),rgba(168,85,247,.08));
  color:var(--primary);font-weight:600;}
.subject-item input[type="checkbox"]{width:18px;height:18px;margin:0;flex-shrink:0;
  accent-color:var(--primary);cursor:pointer;}
.subject-counter{margin-top:10px;font-size:12px;color:var(--text-muted);
  display:flex;justify-content:space-between;align-items:center;}
.subject-counter b{color:var(--primary);font-weight:700}

/* ============================================================
   ЖУРНАЛ — ТАБЛИЦА
============================================================ */
.journal-filters{
  display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;
  padding:16px 20px;background:var(--bg-elev);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--border);
}
.journal-filters .filter{
  display:flex;flex-direction:column;gap:4px;min-width:150px;flex:1;
}
.journal-filters .filter label{
  font-size:10px;text-transform:uppercase;color:var(--text-muted);
  font-weight:700;letter-spacing:.05em;
}
.journal-filters select{padding:8px 11px;font-size:13px}
.journal-filters .btn{flex-shrink:0}

.journal-info{
  padding:12px 20px;background:var(--bg-elev);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--border);
  font-size:13px;line-height:1.7;color:var(--text-muted);
}
.journal-info b{color:var(--text);font-weight:600}

.journal-wrap{
  overflow:auto;max-height:70vh;background:var(--bg-elev);
  border-radius:var(--radius);border:1px solid var(--border);
  box-shadow:var(--shadow);position:relative;
  -webkit-overflow-scrolling:touch;
}
.journal-table{
  border-collapse:separate;border-spacing:0;font-size:12px;
  width:max-content;min-width:100%;
}
.journal-table th,.journal-table td{
  border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:6px 8px;text-align:center;background:var(--bg-elev);
  white-space:nowrap;min-width:38px;
}
.journal-table thead th{
  background:var(--bg);font-weight:700;font-size:11px;
  color:var(--text-muted);position:sticky;z-index:2;
}
.journal-table thead tr:nth-child(1) th{top:0;height:28px}
.journal-table thead tr:nth-child(2) th{top:28px;height:32px}
.journal-table thead tr:nth-child(3) th{top:60px;height:24px;font-size:10px;color:var(--text-muted)}

.journal-table .col-num{
  position:sticky;left:0;z-index:3;min-width:34px;max-width:34px;
  text-align:center;font-weight:600;color:var(--text-muted);
  background:var(--bg-elev);
}
.journal-table .col-name{
  position:sticky;left:34px;z-index:3;min-width:190px;text-align:left;
  padding-left:12px;background:var(--bg-elev);font-weight:500;
}
.journal-table thead .col-num,
.journal-table thead .col-name{z-index:5;background:var(--bg)}

.journal-table .col-avg{
  position:sticky;right:70px;z-index:3;min-width:56px;
  background:var(--bg-elev);font-weight:700;
}
.journal-table .col-final{
  position:sticky;right:0;z-index:3;min-width:66px;
  background:var(--bg-elev);font-weight:700;
}
.journal-table thead .col-avg,
.journal-table thead .col-final{z-index:5;background:var(--bg)}

.journal-cell{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:6px;font-weight:800;
  color:#fff;font-size:11px;cursor:pointer;transition:var(--transition);
}
.journal-cell:hover{transform:scale(1.15);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.journal-cell.empty{background:transparent;border:1.5px dashed var(--border);color:var(--text-muted)}
.journal-cell.empty:hover{border-color:var(--primary);color:var(--primary)}
.g-5{background:#10B981}
.g-4{background:#84CC16}
.g-3{background:#F59E0B}
.g-2{background:#EF4444}
.g-1{background:#991B1B}
.g-avg-5{color:#10B981}
.g-avg-4{color:#65A30D}
.g-avg-3{color:#D97706}
.g-avg-2{color:#DC2626}
.g-avg-1{color:#991B1B}

.journal-table .date-h{
  cursor:pointer;user-select:none;transition:var(--transition);
  padding:5px 4px;min-width:38px;
}
.journal-table .date-h:hover{background:rgba(14,165,233,.12);color:var(--primary)}
.journal-table .date-h.weekend{color:#EF4444}
.journal-table .date-h.today{
  background:linear-gradient(135deg,rgba(14,165,233,.15),rgba(168,85,247,.1));
  color:var(--primary);font-weight:800;
}
.journal-table .date-h .type-mark{
  display:block;font-size:9px;font-weight:700;
  color:var(--text-muted);margin-top:1px;
  text-transform:uppercase;letter-spacing:.02em;
}
.journal-table .month-h{
  background:linear-gradient(180deg,var(--bg) 0%,rgba(14,165,233,.05) 100%) !important;
  font-weight:800;color:var(--text) !important;
  font-size:12px !important;letter-spacing:.05em;
}

/* Тултип с уроком */
.lesson-tip{
  position:absolute;z-index:100;background:var(--bg-elev);
  border:1px solid var(--border);border-radius:10px;padding:12px 14px;
  box-shadow:var(--shadow-lg);max-width:280px;font-size:12px;
  line-height:1.5;pointer-events:none;
  animation:fadeIn .15s ease;
}
.lesson-tip .tip-title{
  font-size:10px;text-transform:uppercase;color:var(--text-muted);
  font-weight:700;letter-spacing:.06em;margin-bottom:4px;
}
.lesson-tip .tip-body{color:var(--text);margin-bottom:10px}
.lesson-tip .tip-body:last-child{margin-bottom:0}

/* Модалка оценок */
.grade-picker{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;
}
.grade-btn{
  width:48px;height:48px;border-radius:10px;border:2px solid var(--border);
  background:var(--bg);color:var(--text);font-size:18px;font-weight:800;
  cursor:pointer;transition:var(--transition);
  display:inline-flex;align-items:center;justify-content:center;
}
.grade-btn:hover{transform:translateY(-2px);border-color:var(--primary)}
.grade-btn.active{color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.grade-btn.active.gb-5{background:#10B981}
.grade-btn.active.gb-4{background:#84CC16}
.grade-btn.active.gb-3{background:#F59E0B}
.grade-btn.active.gb-2{background:#EF4444}
.grade-btn.active.gb-1{background:#991B1B}

.tabs-mini{
  display:flex;gap:4px;background:var(--bg);border-radius:10px;
  padding:4px;margin-bottom:18px;
}
.tabs-mini button{
  flex:1;padding:8px;border:none;background:transparent;
  color:var(--text-muted);font-weight:600;border-radius:7px;
  cursor:pointer;font-size:13px;transition:var(--transition);
}
.tabs-mini button.active{background:var(--bg-elev);color:var(--text);box-shadow:var(--shadow)}

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const el = (tag, props = {}, ...children) => {
  const n = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v);
  });
  children.flat().forEach(c => n.append(c?.nodeType ? c : document.createTextNode(c ?? '')));
  return n;
};

const TOAST_ICONS = {success:'checkCircle',error:'xCircle',warning:'alertCircle',info:'info'};
function toast(msg, type = 'info') {
  const t = el('div', { class: `toast ${type}`, html: `${ic(TOAST_ICONS[type]||'info', 18)}<div>${msg}</div>` });
  $('#toast-root').appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

function showModal(title, bodyHtml, actions = [], opts = {}) {
  const root = $('#modal-root');
  root.innerHTML = '';
  const backdrop = el('div', { class: 'modal-backdrop' });
  backdrop.innerHTML = `
    <div class="modal ${opts.wide ? 'modal-wide' : ''}">
      <h3 class="modal-title">${title}</h3>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-actions"></div>
    </div>`;
  const actionsEl = backdrop.querySelector('.modal-actions');
  actions.forEach(a => {
    const b = el('button', {
      class: `btn ${a.class || 'btn-ghost'}`,
      onclick: () => a.onClick ? a.onClick(backdrop) : closeModal()
    }, a.label);
    actionsEl.appendChild(b);
  });
  backdrop.onclick = (e) => { if (e.target === backdrop) closeModal(); };
  root.appendChild(backdrop);
  return backdrop;
}
function closeModal() { $('#modal-root').innerHTML = ''; }

function confirmDialog(title, message) {
  return new Promise(res => {
    showModal(`${ic('alertCircle',20)} ${title}`, `<p>${message}</p>`, [
      { label: 'Отмена', onClick: () => { closeModal(); res(false); } },
      { label: 'Подтвердить', class: 'btn-danger', onClick: () => { closeModal(); res(true); } }
    ]);
  });
}

  const btn = $('#theme-toggle');

    btn.innerHTML = t === 'dark' ? ic('sun', 16) : ic('moon', 16);
    btn.onclick = () => {
      const cur = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = cur;
      localStorage.setItem('theme', cur);
      btn.innerHTML = cur === 'dark' ? ic('sun', 16) : ic('moon', 16);
    };
  }
}

function showAuthMsg(text, type = 'error') {

$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const loginInput = $('#login-input').value.trim();
  const password   = $('#login-password').value;
  if (!loginInput || !password) return;
  if (loginInput === HARDCODED_ADMIN.login && password === HARDCODED_ADMIN.password) {
    const user = { uid: 'admin-local', email: HARDCODED_ADMIN.profile.email };
    const profile = { ...HARDCODED_ADMIN.profile, createdAt: Date.now() };
    setSession(user, profile);
    startApp(user, profile);
    return;
  }
  try {
    let email = loginInput;
    if (!loginInput.includes('@')) {
      const snap = await db.ref('users').orderByChild('login').equalTo(loginInput).once('value');
      if (!snap.exists()) return showAuthMsg('Пользователь с таким логином не найден');
      email = Object.values(snap.val())[0].email;
    }
    await auth.signInWithEmailAndPassword(email, password);
  } catch (err) { showAuthMsg(translateError(err)); }
});
$('#register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code=$('#invite-code').value.trim().toUpperCase();
  const name=$('#reg-name').value.trim();
  const login=$('#reg-login').value.trim();
  const email=$('#reg-email').value.trim();
  const password=$('#reg-password').value;
  try {
    const inviteSnap = await db.ref('invites/' + code).once('value');
    if (!inviteSnap.exists()) return showAuthMsg('Неверный код приглашения');
    const invite = inviteSnap.val();
    if (invite.used) return showAuthMsg('Код уже использован');
    if (invite.expiresAt && invite.expiresAt < Date.now()) return showAuthMsg('Код истёк');
    const loginCheck = await db.ref('users').orderByChild('login').equalTo(login).once('value');
    if (loginCheck.exists()) return showAuthMsg('Такой логин уже занят');
    const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    await secondaryAuth.signOut();
    await db.ref('users/' + uid).set({
      role: invite.role || 'teacher', login, name, email,
      schoolId: invite.schoolId || null, cityId: invite.cityId || null, createdAt: Date.now()
    });
    await db.ref('invites/' + code).update({ used: true, usedBy: uid, usedAt: Date.now() });
    showAuthMsg('Регистрация успешна! Входим…', 'success');

function buildMenu() {
  const nav = $('#sidebar-nav');
  nav.innerHTML = '';
  (MENU[App.profile.role] || []).forEach(it => {
    nav.appendChild(el('div', {
      class: 'nav-item' + (location.hash === '#' + it.id ? ' active' : ''),
      html: ic(it.icon, 18) + `<span>${it.label}</span>`,
      onclick: () => navigate(it.id)
    }));
  });
}
function navigate(view, params = {}) {
  location.hash = '#' + view + (params.id ? '/' + params.id : '');
  router();
}
async function router() {
  const hash = location.hash.slice(1) || 'dashboard';
  const [view, id] = hash.split('/');
  if (!App.profile) return;
  const items = MENU[App.profile.role] || [];
  const allowed = items.map(i => i.id);
  const HIDDEN = ['class'];
  HIDDEN.forEach(v => { if (!allowed.includes(v)) allowed.push(v); });
  if (!allowed.includes(view)) return navigate('dashboard');
  $$('.nav-item').forEach(n => n.classList.remove('active'));
  const idx = items.findIndex(i => i.id === view);
  if (idx >= 0) $$('.nav-item')[idx]?.classList.add('active');
  const renderers = {
    dashboard: renderDashboard, cities: renderCities, schools: renderSchools,
    users: renderUsers, invites: renderInvites, classes: renderClasses,
    class: () => renderClassDetail(id), journal: renderJournal,
    students: renderStudents, worktypes: renderWorkTypes, profile: renderProfile
  };
  const fn = renderers[view];
  if (fn) await fn();
  $('#sidebar').classList.remove('open');
}
window.addEventListener('hashchange', router);

async function bootstrapDefaultWorkTypes() {
  try {

    const updates = {};
    DEFAULT_WORK_TYPES.forEach(wt => {

async function renderJournal() {
  $('#page-title').textContent = 'Журнал';
  const c = $('#content'); c.innerHTML = '';

  const classes = myClasses();
  if (!Object.keys(classes).length) {
    c.appendChild(el('div', { class: 'card empty' }, 'Сначала создайте класс'));
    return;
  }

  // Состояние фильтров — сохраняем между рендерами
  const state = App._journalState = App._journalState || {
    classId: Object.keys(classes)[0],
    subject: null,
    period: 'all'
  };
  if (!classes[state.classId]) state.classId = Object.keys(classes)[0];
  const currentClass = classes[state.classId];
  const subjects = currentClass.subjects || [];
  if (!state.subject || !subjects.includes(state.subject)) {
    state.subject = subjects[0] || null;
  }

  // Фильтры
  const filters = el('div', { class: 'journal-filters' });
  const classFilter = el('div', { class: 'filter' },
    el('label', {}, 'Класс'),
    (() => {
      const s = el('select');
      Object.entries(classes).forEach(([id,cl]) => s.appendChild(new Option(cl.name, id)));
      s.value = state.classId;
      s.onchange = () => { state.classId = s.value; state.subject = null; renderJournal(); };
      return s;
    })()
  );
  const subjectFilter = el('div', { class: 'filter' },
    el('label', {}, 'Предмет'),
    (() => {
      const s = el('select');
      subjects.forEach(sub => s.appendChild(new Option(sub, sub)));
      s.value = state.subject || '';
      s.onchange = () => { state.subject = s.value; renderJournal(); };
      return s;
    })()
  );
  filters.append(classFilter, subjectFilter);
  filters.appendChild(el('button', {
    class: 'btn btn-primary',
    html: ic('plus', 16) + ' Добавить урок',
    onclick: () => openLessonDialog({ classId: state.classId, subject: state.subject })
  }));
  filters.appendChild(el('button', {
    class: 'btn btn-ghost',
    html: ic('download', 16) + ' Экспорт',
    onclick: () => exportJournalCSV(state.classId, state.subject)
  }));
  c.appendChild(filters);

  // Инфо
  const teacher = App.profile;
  const cls = App.cache.classes[state.classId];
  const classTeacher = App.cache.users[cls.teacherId];
  const info = el('div', { class: 'journal-info' });
  info.innerHTML = `
    <div><b>Класс:</b> ${cls.name} • <b>Предмет:</b> ${state.subject || '—'}</div>
    <div><b>Учитель:</b> ${teacher.name || teacher.login || '—'}</div>`;
  c.appendChild(info);

  // Таблица
  const wrap = el('div', { class: 'journal-wrap' });
  const table = buildJournalTable(state.classId, state.subject);
  if (table) wrap.appendChild(table);
  else wrap.appendChild(el('div', { class: 'empty' }, 'Нет данных для отображения'));
  c.appendChild(wrap);
}

/* Построение таблицы журнала */
function buildJournalTable(classId, subject) {
  const students = Object.entries(App.cache.students)
    .filter(([,s]) => s.classId === classId)
    .sort((a,b) => a[1].name.localeCompare(b[1].name));
  if (!students.length) return null;

  // Уроки для этого класса+предмета
  const lessons = Object.entries(App.cache.lessons)
    .filter(([,l]) => l.classId === classId && l.subject === subject)
    .map(([id, l]) => ({ id, ...l, dateMs: new Date(l.date).setHours(0,0,0,0) }))
    .sort((a,b) => a.dateMs - b.dateMs);

  // Оценки для этого класса+предмета
  const grades = Object.entries(App.cache.grades)
    .filter(([,g]) => g.classId === classId && g.subject === subject)
    .map(([id, g]) => ({ id, ...g, dateMs: new Date(g.date).setHours(0,0,0,0) }));

  // Собираем все уникальные даты (из уроков + оценок)
  const allDates = [...new Set([...lessons.map(l=>l.dateMs), ...grades.map(g=>g.dateMs)])]
    .sort((a,b) => a - b);

  if (!allDates.length) {
    // Нет ни уроков, ни оценок — показываем простую таблицу
    const emptyWrap = el('div');
    emptyWrap.innerHTML = `
      <div class="empty">
        <div style="font-size:14px;margin-bottom:6px;">Журнал пуст</div>
        <div style="font-size:12px;">Нажмите «Добавить урок», чтобы начать вести журнал</div>
      </div>`;
    return emptyWrap;
  }

  // Группировка дат по месяцам
  const monthsMap = new Map();
  allDates.forEach(ms => {
    const d = new Date(ms);
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    if (!monthsMap.has(key)) monthsMap.set(key, { name: d.toLocaleDateString('ru-RU', {month:'long'}), dates: [] });
    monthsMap.get(key).dates.push(ms);
  });

  // Индексы оценок для быстрого поиска: studentId_dateMs -> grade
  const gradeIndex = new Map();
  grades.forEach(g => gradeIndex.set(`${g.studentId}_${g.dateMs}`, g));

  // Создание таблицы
  const table = el('table', { class: 'journal-table' });

  // --- THEAD ---
  const thead = el('thead');

  // Row 1: месяцы
  const tr1 = el('tr');
  tr1.appendChild(el('th', { class: 'col-num', rowspan: '3' }, '№'));
  tr1.appendChild(el('th', { class: 'col-name', rowspan: '3' }, 'Ф.И. ученика'));
  monthsMap.forEach(m => {
    tr1.appendChild(el('th', { class: 'month-h', colspan: String(m.dates.length) }, m.name));
  });
  tr1.appendChild(el('th', { class: 'col-avg', rowspan: '3' }, 'Средний'));
  tr1.appendChild(el('th', { class: 'col-final', rowspan: '3' }, 'Итог'));
  thead.appendChild(tr1);

  // Row 2: даты
  const tr2 = el('tr');
  const todayMs = new Date().setHours(0,0,0,0);
  allDates.forEach(ms => {
    const d = new Date(ms);
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const isToday = ms === todayMs;
    const cls = 'date-h' + (isWeekend ? ' weekend' : '') + (isToday ? ' today' : '');
    const th = el('th', {
      class: cls,
      'data-date': String(ms),
      'data-classid': classId,
      'data-subject': subject
    });
    th.innerHTML = `${d.getDate()}<span class="type-mark">${d.toLocaleDateString('ru-RU',{weekday:'short'})}</span>`;
    th.onclick = () => openLessonDialog({ classId, subject, dateMs: ms });
    // Тултип при наведении
    const lesson = lessons.find(l => l.dateMs === ms);
    if (lesson && (lesson.topic || lesson.homework)) {
      th.onmouseenter = (e) => showLessonTip(e.target, lesson);
      th.onmouseleave = hideLessonTip;
    }
    tr2.appendChild(th);
  });
  thead.appendChild(tr2);

  // Row 3: типы работ (сокращённые коды оценок по каждому дню)
  const tr3 = el('tr');
  allDates.forEach(ms => {
    // Определяем тип работы: берём тип первой оценки в этот день
    const dayGrades = grades.filter(g => g.dateMs === ms);
    let typeCode = '—';
    if (dayGrades.length) {
      const wt = App.cache.workTypes[dayGrades[0].typeId];
      typeCode = wt?.code || (wt?.name ? wt.name.substring(0,3).toUpperCase() : '—');
    }
    tr3.appendChild(el('th', {}, typeCode));
  });
  thead.appendChild(tr3);
  table.appendChild(thead);

  // --- TBODY ---
  const tbody = el('tbody');
  students.forEach(([sid, s], idx) => {
    const tr = el('tr');
    tr.appendChild(el('td', { class: 'col-num' }, String(idx + 1)));
    tr.appendChild(el('td', { class: 'col-name' }, s.name));

    // Ячейки по датам
    allDates.forEach(ms => {
      const td = el('td');
      const g = gradeIndex.get(`${sid}_${ms}`);
      if (g) {
        const cell = el('div', {
          class: `journal-cell ${gradeClass(g.value)}`,
          title: `${App.cache.workTypes[g.typeId]?.name || ''}\n${fmt.date(g.date)}`
        }, String(g.value));
        cell.onclick = () => openGradeCellDialog(classId, subject, sid, ms, g.id);
        td.appendChild(cell);
      } else {
        const cell = el('div', {
          class: 'journal-cell empty',
          title: 'Нажмите чтобы поставить оценку'
        }, '+');
        cell.onclick = () => openGradeCellDialog(classId, subject, sid, ms);
        td.appendChild(cell);
      }
      tr.appendChild(td);
    });

    // Средний балл
    const studentGrades = Object.values(App.cache.grades).filter(g => g.studentId === sid && g.classId === classId && g.subject === subject);
    const avg = weightedAvg(studentGrades);
    const tdAvg = el('td', { class: `col-avg ${avgClass(avg)}` }, avg ? String(avg) : '—');
    tr.appendChild(tdAvg);

    // Итоговая (просто округление среднего)
    const finalMark = avg ? Math.round(avg) : '—';
    const tdFinal = el('td', { class: `col-final ${avgClass(avg)}` }, String(finalMark));
    tr.appendChild(tdFinal);

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  return table;
}

/* Тултип с уроком */
let _lessonTipEl = null;
function showLessonTip(target, lesson) {
  hideLessonTip();
  const rect = target.getBoundingClientRect();
  const tip = el('div', { class: 'lesson-tip' });
  tip.innerHTML = `
    <div class="tip-title">Тема урока</div>
    <div class="tip-body">${lesson.topic || 'не задана'}</div>
    <div class="tip-title">Домашняя работа</div>
    <div class="tip-body">${lesson.homework || 'без задания'}</div>`;
  document.body.appendChild(tip);
  const scrollY = window.scrollY;
  const scrollX = window.scrollX;
  tip.style.left = (rect.left + scrollX + rect.width / 2 - 140) + 'px';
  tip.style.top = (rect.bottom + scrollY + 8) + 'px';
  _lessonTipEl = tip;
}
function hideLessonTip() {
  if (_lessonTipEl) { _lessonTipEl.remove(); _lessonTipEl = null; }
}

/* Диалог редактирования урока */
function openLessonDialog({ classId, subject, dateMs }) {
  const dateStr = dateMs ? new Date(dateMs).toISOString().slice(0,10) : new Date().toISOString().slice(0,10);
  // Ищем существующий урок
  const existing = Object.entries(App.cache.lessons)
    .find(([,l]) => l.classId === classId && l.subject === subject && new Date(l.date).setHours(0,0,0,0) === new Date(dateStr).setHours(0,0,0,0));

  const cls = App.cache.classes[classId];

  showModal(`${ic('calendar', 20)} ${existing ? 'Редактировать' : 'Новый'} урок`, `
    <div class="form-group">
      <label>Класс / Предмет</label>
      <input value="${cls.name} / ${subject}" disabled>
    </div>
    <div class="form-group">
      <label>Дата</label>
      <input type="date" id="ls-date" value="${dateStr}">
    </div>
    <div class="form-group">
      <label>Тема урока</label>
      <textarea id="ls-topic" placeholder="Например: Вредные привычки и их влияние на здоровье">${existing ? (existing[1].topic || '') : ''}</textarea>
    </div>
    <div class="form-group">
      <label>Домашняя работа</label>
      <textarea id="ls-hw" placeholder="Например: параграф 5, вопросы 1-3 или без задания">${existing ? (existing[1].homework || '') : ''}</textarea>
    </div>
  `, [
    ...(existing ? [{ label: 'Удалить', class: 'btn-danger', onClick: async () => {
      if (await confirmDialog('Удалить урок?', 'Тема и ДЗ будут удалены. Оценки останутся.')) {
        await db.ref('lessons/' + existing[0]).remove();
        toast('Урок удалён', 'success');
        await loadAll(); renderJournal();
      }
    }}] : []),
    { label: 'Отмена' },
    { label: 'Сохранить', class: 'btn-primary', onClick: async () => {
      const date = document.getElementById('ls-date').value;
      const topic = document.getElementById('ls-topic').value.trim();
      const hw = document.getElementById('ls-hw').value.trim();
      if (!date) return toast('Укажите дату', 'error');

      const dateMs = new Date(date).setHours(0,0,0,0);
      const payload = {
        classId, subject,
        teacherId: App.user.uid,
        date: dateMs,
        topic, homework: hw,
        updatedAt: Date.now()
      };

      if (existing) {
        await db.ref('lessons/' + existing[0]).update(payload);
        toast('Урок обновлён', 'success');
      } else {
        payload.createdAt = Date.now();
        const id = db.ref('lessons').push().key;
        await db.ref('lessons/' + id).set(payload);
        toast('Урок добавлен', 'success');
      }
      closeModal();
      await loadAll(); renderJournal();
    }}
  ]);
}

/* Диалог оценки в ячейке */
function openGradeCellDialog(classId, subject, studentId, dateMs, existingGradeId) {
  const student = App.cache.students[studentId];
  const cls = App.cache.classes[classId];
  const existing = existingGradeId ? App.cache.grades[existingGradeId] : null;
  const dateStr = new Date(dateMs).toISOString().slice(0,10);

  // Типы работ
  const workTypes = Object.entries(App.cache.workTypes)
    .sort((a,b) => (a[1].weight || 0) - (b[1].weight || 0));
  if (!workTypes.length) return toast('Сначала создайте типы работ', 'warning');

  let selectedValue = existing ? existing.value : null;

  const wtOpts = workTypes.map(([id, w]) =>
    `<option value="${id}" ${existing && existing.typeId === id ? 'selected' : ''}>${w.name} (вес ${w.weight})</option>`
  ).join('');

  const gradeBtns = [5,4,3,2,1].map(v => {
    const active = (existing ? existing.value : null) === v ? 'active' : '';
    return `<button type="button" class="grade-btn gb-${v} ${active}" data-value="${v}">${v}</button>`;
  }).join('');

  showModal(`${ic('pencil', 20)} Оценка`, `
    <div class="form-group">
      <label>Класс / Предмет</label>
      <input value="${cls.name} / ${subject}" disabled>
    </div>
    <div class="form-group">
      <label>Ученик</label>
      <input value="${student.name}" disabled>
    </div>
    <div class="form-group">
      <label>Дата</label>
      <input type="date" id="gd-date" value="${dateStr}">
    </div>
    <div class="form-group">
      <label>Тип работы</label>
      <select id="gd-type">${wtOpts}</select>
    </div>
    <div class="form-group">
      <label>Оценка *</label>
      <div class="grade-picker" id="gd-picker">${gradeBtns}</div>
    </div>
    <div class="form-group">
      <label>Замечания</label>
      <textarea id="gd-notes" placeholder="Оставьте комментарий…">${existing?.notes || ''}</textarea>
    </div>
  `, [
    ...(existing ? [{ label: 'Удалить', class: 'btn-danger', onClick: async () => {
      if (await confirmDialog('Удалить оценку?', 'Действие необратимо.')) {
        await db.ref('grades/' + existingGradeId).remove();
        toast('Оценка удалена', 'success');
        closeModal(); await loadAll(); renderJournal();
      }
    }}] : []),
    { label: 'Отмена' },
    { label: 'Сохранить', class: 'btn-primary', onClick: async () => {
      if (!selectedValue) return toast('Выберите оценку', 'error');
      const date = document.getElementById('gd-date').value;
      const typeId = document.getElementById('gd-type').value;
      const notes = document.getElementById('gd-notes').value.trim();
      const wt = App.cache.workTypes[typeId];
      const gDate = new Date(date).setHours(0,0,0,0);

      if (existing) {
        // Сохраняем историю
        const history = [...(existing.history || [])];
        if (existing.value !== selectedValue) {
          history.push({ changedBy: App.user.uid, changedAt: Date.now(), oldValue: existing.value, newValue: selectedValue });
        }
        await db.ref('grades/' + existingGradeId).update({
          value: selectedValue, date: gDate, typeId, weight: wt.weight, notes, history
        });
        toast('Оценка обновлена', 'success');
      } else {
        const gid = db.ref('grades').push().key;
        await db.ref('grades/' + gid).set({
          studentId, classId, subject, teacherId: App.user.uid,
          date: gDate, typeId, weight: wt.weight, value: selectedValue, notes, history: []
        });
        toast('Оценка выставлена', 'success');
      }
      closeModal();
      await loadAll(); renderJournal();
    }}
  ]);

  // Обработка кнопок оценок
  setTimeout(() => {
    const picker = document.getElementById('gd-picker');
    picker.querySelectorAll('.grade-btn').forEach(btn => {
      btn.onclick = () => {
        picker.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedValue = +btn.dataset.value;
      };
    });
  }, 50);
}

/* Экспорт журнала в CSV */
function exportJournalCSV(classId, subject) {
  const cls = App.cache.classes[classId];
  const students = Object.entries(App.cache.students).filter(([,s]) => s.classId === classId)
    .sort((a,b) => a[1].name.localeCompare(b[1].name));
  const grades = Object.entries(App.cache.grades).filter(([,g]) => g.classId === classId && g.subject === subject)
    .map(([id, g]) => ({ id, ...g, dateMs: new Date(g.date).setHours(0,0,0,0) }));
  const dates = [...new Set(grades.map(g => g.dateMs))].sort((a,b) => a - b);

  let csv = `Журнал ${cls.name} / ${subject}\n`;
  csv += '№;Ученик;' + dates.map(d => new Date(d).toLocaleDateString('ru-RU')).join(';') + ';Средний\n';
  students.forEach(([sid, s], i) => {
    const row = [i + 1, s.name];
    dates.forEach(d => {
      const g = grades.find(g => g.studentId === sid && g.dateMs === d);
      row.push(g ? g.value : '');
    });
    const studentGrades = grades.filter(g => g.studentId === sid);
    row.push(weightedAvg(studentGrades) || '');
    csv += row.join(';') + '\n';
  });

  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `journal_${cls.name}_${subject}.csv`; a.click();
  URL.revokeObjectURL(url);
}

    <div class="form-group"><label>ФИО</label><input id="sc-name"></div>
    <div class="form-group"><label>Логин</label><input id="sc-login"></div>
    <div class="form-group"><label>Email</label><input id="sc-email" type="email"></div>
    <div class="form-group"><label>Пароль</label><input id="sc-pass" type="password" minlength="6"></div>
  `, [{ label:'Отмена' }, { label:'Создать', class:'btn-primary', onClick: async () => {
    const name = document.getElementById('sc-name').value.trim();
    const login = document.getElementById('sc-login').value.trim();
    const email = document.getElementById('sc-email').value.trim();
    const pass = document.getElementById('sc-pass').value;
    if (!name || !login || !email || pass.length < 6) return toast('Заполните все поля (пароль ≥6)','error');
    try {
      const cred = await secondaryAuth.createUserWithEmailAndPassword(email, pass);
      const uid = cred.user.uid; await secondaryAuth.signOut();
      await db.ref('users/'+uid).set({ role:'school_creator', login, name, email, schoolId, cityId, createdAt: Date.now() });
      closeModal(); toast('Создатель школы создан','success'); await loadAll(); renderSchools();
    } catch (err) { toast(translateError(err),'error'); }
  }}]);
}

function createInvite() {
  const code = Math.random().toString(36).substring(2, 8).toUpperCase();
  const expiresAt = Date.now() + 7 * 24 * 60 * 60 * 1000;
  db.ref('invites/'+code).set({
    role:'teacher', schoolId: App.profile.schoolId || null,
    cityId: App.profile.cityId || null, createdBy: App.user.uid,
    used: false, createdAt: Date.now(), expiresAt
  }).then(async () => { toast(`Код создан: <b>${code}</b>`,'success'); await loadAll(); renderInvites(); });
}

/* ★ Класс с чекбоксами предметов */
function addClassDialog() {
  const groupsHtml = POPULAR_SUBJECTS.map((g, gi) => `
    <div class="subject-group" data-group="${gi}">
      <div class="subject-group-title">${ic('list',12)} ${g.group}</div>
      ${g.items.map(name => `
        <label class="subject-item" data-name="${name}">
          <input type="checkbox" value="${name}"><span>${name}</span>
        </label>`).join('')}
    </div>`).join('');

  const dialog = showModal(`${ic('cap',20)} Новый класс`, `
    <div class="form-group"><label>Название класса</label>
      <input id="m-cl-name" placeholder="1А"></div>
    <div class="form-group"><label>Год</label>
      <input id="m-cl-year" type="number" value="${new Date().getFullYear()}"></div>
    <div class="form-group">
      <label>Предметы</label>
      <div class="subjects-toolbar">
        <input type="text" id="m-cl-search" placeholder="Поиск предмета...">
        <button type="button" class="btn btn-sm btn-ghost" id="m-cl-all">Выбрать все</button>
        <button type="button" class="btn btn-sm btn-ghost" id="m-cl-clr">Очистить</button>
      </div>
      <div class="subjects-box" id="m-cl-box">${groupsHtml}</div>
      <div class="subject-counter"><span>Выбрано предметов: <b id="m-cl-counter">0</b></span></div>
    </div>
  `, [
    { label: 'Отмена' },
    { label: 'Создать', class: 'btn-primary', onClick: async () => {
      const name = document.getElementById('m-cl-name').value.trim();
      const year = +document.getElementById('m-cl-year').value;
      const subjects = Array.from(dialog.querySelectorAll('.subject-item input:checked')).map(cb => cb.value);
      if (!name) return toast('Введите название класса','error');
      if (!subjects.length) return toast('Выберите хотя бы один предмет','error');
      const id = db.ref('classes').push().key;
      await db.ref('classes/'+id).set({
        name, year, subjects, teacherId: App.user.uid,
        schoolId: App.profile.schoolId || null, createdAt: Date.now()
      });
      closeModal(); toast(`Класс создан, предметов: <b>${subjects.length}</b>`,'success');
      await loadAll(); renderClasses();
    }}
  ], { wide: true });

  setTimeout(() => {
    const box = dialog.querySelector('#m-cl-box');
    const search = dialog.querySelector('#m-cl-search');
    const counter = dialog.querySelector('#m-cl-counter');
    const items = dialog.querySelectorAll('.subject-item');
    const upd = () => counter.textContent = dialog.querySelectorAll('.subject-item input:checked').length;
    items.forEach(item => {
      const cb = item.querySelector('input');
      item.addEventListener('click', e => {
        if (e.target !== cb) cb.checked = !cb.checked;
        item.classList.toggle('checked', cb.checked); upd();
      });
      cb.addEventListener('change', () => { item.classList.toggle('checked', cb.checked); upd(); });
    });
    search.oninput = () => {
      const q = search.value.toLowerCase().trim();
      items.forEach(item => {
        const match = !q || item.dataset.name.toLowerCase().includes(q);
        item.style.display = match ? '' : 'none';
      });
      dialog.querySelectorAll('.subject-group').forEach(g => {
        const visible = Array.from(g.querySelectorAll('.subject-item')).some(i => i.style.display !== 'none');
        g.style.display = visible ? '' : 'none';
      });
    };
    dialog.querySelector('#m-cl-all').onclick = () => {
      items.forEach(i => { if (i.style.display !== 'none') { i.querySelector('input').checked = true; i.classList.add('checked'); }});
      upd();
    };
    dialog.querySelector('#m-cl-clr').onclick = () => {
      items.forEach(i => { i.querySelector('input').checked = false; i.classList.remove('checked'); });
      upd();
    };
    dialog.querySelector('#m-cl-name')?.focus(); upd();
  }, 50);
}

function addStudentDialog(classId) {
  showModal(`${ic('userPlus',20)} Новые ученики`, `
    <div class="form-group">
      <label>ФИО учеников</label>
      <textarea id="m-st-names" placeholder="Иванов Иван Иванович, Петров Пётр Петрович, Сидорова Анна Сергеевна"></textarea>
      <div class="hint">${ic('info',14)} Вводите несколько учеников через запятую или каждый с новой строки.</div>
    </div>
  `, [{ label:'Отмена' }, { label:'Добавить', class:'btn-primary', onClick: async () => {
    const raw = document.getElementById('m-st-names').value;
    const names = raw.split(/[,\n]+/).map(s => s.trim()).filter(Boolean);
    if (!names.length) return toast('Введите хотя бы одно ФИО','error');
    const u = {}; const now = Date.now();
    names.forEach((name, i) => {
      const id = db.ref('students').push().key;
      u['students/'+id] = { name, classId, createdAt: now + i };
    });
    await db.ref().update(u); closeModal();
    toast(`Добавлено учеников: <b>${names.length}</b>`,'success');
    await loadAll(); renderClassDetail(classId);
  }}]);
  setTimeout(() => document.getElementById('m-st-names')?.focus(), 100);
}

function addStudentsDialog() {
  const classes = myClasses();
  if (!Object.keys(classes).length) return toast('Сначала создайте класс','warning');
  const opts = Object.entries(classes).sort((a,b) => a[1].name.localeCompare(b[1].name))
    .map(([id,c]) => `<option value="${id}">${c.name}</option>`).join('');
  showModal(`${ic('userPlus',20)} Добавить учеников`, `
    <div class="form-group"><label>Класс</label><select id="m-as-class">${opts}</select></div>
    <div class="form-group">
      <label>ФИО учеников</label>
      <textarea id="m-as-names" placeholder="Иванов Иван, Петров Пётр, Сидорова Анна"></textarea>
    </div>
  `, [{ label:'Отмена' }, { label:'Добавить', class:'btn-primary', onClick: async () => {
    const classId = document.getElementById('m-as-class').value;
    const raw = document.getElementById('m-as-names').value;
    const names = raw.split(/[,\n]+/).map(s => s.trim()).filter(Boolean);
    if (!names.length) return toast('Введите хотя бы одно ФИО','error');
    const u = {}; const now = Date.now();
    names.forEach((name, i) => {
      const id = db.ref('students').push().key;
      u['students/'+id] = { name, classId, createdAt: now + i };
    });
    await db.ref().update(u); closeModal();
    toast(`Добавлено учеников: <b>${names.length}</b>`,'success');
    await loadAll(); renderStudents();
  }}]);
}

async function deleteStudent(sid, name) {
  if (await confirmDialog('Удалить ученика?', `"${name}" будет удалён вместе с оценками.`)) {
    const u = { ['students/'+sid]: null };
    Object.entries(App.cache.grades).forEach(([gid,g]) => { if (g.studentId === sid) u['grades/'+gid] = null; });
    await db.ref().update(u); toast('Ученик удалён','success');
    await loadAll(); router();
  }
}

function addWorkTypeDialog() {
  showModal(`${ic('tag',20)} Новый тип работы`, `
    <div class="form-group"><label>Название</label><input id="m-wt-name" placeholder="Контрольная работа"></div>
    <div class="form-group"><label>Код (3 буквы)</label><input id="m-wt-code" placeholder="К/Р" maxlength="5"></div>
    <div class="form-group"><label>Вес (1–10)</label><input id="m-wt-weight" type="number" min="1" max="10" value="1"></div>
  `, [{ label:'Отмена' }, { label:'Создать', class:'btn-primary', onClick: async () => {
    const name = document.getElementById('m-wt-name').value.trim();
    const code = document.getElementById('m-wt-code').value.trim().toUpperCase();
    const weight = +document.getElementById('m-wt-weight').value;
    if (!name || weight < 1) return;
    const id = db.ref('workTypes').push().key;
    await db.ref('workTypes/'+id).set({ name, code, weight, schoolId: App.profile.schoolId || null, createdBy: App.user.uid });
    closeModal(); toast('Тип добавлен','success'); await loadAll(); renderWorkTypes();
  }}]);
}

function resetPasswordDialog(email) {
  if (!email) return toast('У пользователя нет email','error');
  showModal(`${ic('key',20)} Сброс пароля`, `<p>Отправить письмо для сброса пароля на <b>${email}</b>?</p>`,
    [{ label:'Отмена' }, { label:'Отправить', class:'btn-primary', onClick: async () => {
      try { await auth.sendPasswordResetEmail(email); toast('Письмо отправлено','success'); }
      catch (e) { toast(e.message,'error'); }
      closeModal();
    }}]);
}

/* Вычисления */
function weightedAvg(list) {
  const s = list.reduce((a,g) => a + g.value * g.weight, 0);
  const w = list.reduce((a,g) => a + g.weight, 0);
  return w ? Math.round(s / w * 100) / 100 : 0;
}
function avgForStudent(sid, classId) {
  return weightedAvg(Object.values(App.cache.grades).filter(g => g.studentId === sid && (!classId || g.classId === classId)));
}
function countStudentsBySchool() {
  const ids = Object.entries(App.cache.classes).filter(([,c]) => c.schoolId === App.profile.schoolId).map(([id]) => id);
  return Object.values(App.cache.students).filter(s => ids.includes(s.classId)).length;
}
function countStudentsInMyClasses() {
  const ids = Object.keys(myClasses());
  return Object.values(App.cache.students).filter(s => ids.includes(s.classId)).length;
}
function countMyGrades() {
  return Object.values(App.cache.grades).filter(g => g.teacherId === App.user.uid).length;
}

/* Переключение экранов */
function showLoader(text) {
  $('#loader-text').textContent = text || 'Загрузка…';
  $('#loader-screen').style.display = 'flex';
  $('#auth-screen').style.display = 'none';
  $('#app-screen').style.display = 'none';
}
function showAuth() {
  $('#loader-screen').style.display = 'none';
  $('#auth-screen').style.display = 'flex';
  $('#app-screen').style.display = 'none';
}
function showApp() {
  $('#loader-screen').style.display = 'none';
  $('#auth-screen').style.display = 'none';
  $('#app-screen').style.display = 'flex';
}

async function startApp(user, profile) {
  App.user = user; App.profile = profile;
  showLoader('Загрузка данных…');
  $('#user-name').textContent = profile.name || profile.login || '';
  $('#user-role').textContent = roleLabel(profile.role);
  try {
    await loadAll();
    await bootstrapDefaultWorkTypes();
    buildMenu();
    showApp();
    if (!location.hash) location.hash = '#dashboard';
    router();
  } catch (err) {
    console.error(err); toast('Ошибка загрузки данных: ' + err.message,'error');
    showApp();
  }
}

$('#logout-btn').onclick = async () => {
  const btn = $('#logout-btn');
  btn.disabled = true;
  btn.innerHTML = ic('logout',16) + ' Выход…';
  clearSession(); App.user = null; App.profile = null;
  try { await auth.signOut(); } catch (e) {}
  location.reload();
};
$('#menu-toggle').onclick = () => $('#sidebar').classList.toggle('open');

(async () => {
  showLoader('Загрузка…');
  const session = getSession();
  if (session && session.user && session.profile) { await startApp(session.user, session.profile); return; }
  auth.onAuthStateChanged(async (fbUser) => {
    if (!fbUser) { showAuth(); return; }
    showLoader('Загрузка профиля…');
    try {
      const snap = await db.ref('users/' + fbUser.uid).once('value');
      if (!snap.exists()) { toast('Профиль пользователя не найден в базе','error'); await auth.signOut(); showAuth(); return; }
      const profile = snap.val();
      setSession({ uid: fbUser.uid, email: fbUser.email }, profile);
      await startApp({ uid: fbUser.uid, email: fbUser.email }, profile);
    } catch (err) {
      console.error(err); toast('Ошибка загрузки профиля: ' + err.message,'error'); showAuth();
    }
  });
})();
</script>
